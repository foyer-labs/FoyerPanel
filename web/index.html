}

/* --- aggiornamento del firmware -----------------------------------------
 *
 * Il file si manda **grezzo**, non dentro un multipart: il server del
 * pannello e scritto a mano e un multipart vorrebbe dire insegnargli a
 * riconoscere i confini fra le parti — codice in piu su un apparecchio che
 * ne ha gia abbastanza, per trasportare una cosa sola. Il corpo e
 * l'immagine, Content-Length dice quanto e lunga, e basta.
 *
 * La barra viene da upload.onprogress di XMLHttpRequest e non da fetch(),
 * ed e l'unica ragione per cui qui c'e XHR invece di fetch: fetch non sa
 * dire a che punto e la **salita**. Due megabyte su un Wi-Fi domestico sono
 * una decina di secondi, e dieci secondi senza nessun segnale sono dieci
 * secondi in cui si pensa che si sia bloccato. */
function schedaAggiornamento(dove) {
  const card = el("div", "card");
  const ch = el("div", "ch");
  ch.append(el("div", "t", t("ota.title")));
  const cb = el("div", "cb");

  cb.append(el("div", "hint", t("ota.hint")));

  const scegli = document.createElement("input");
  scegli.type = "file";
  scegli.accept = ".bin";
  scegli.style.marginTop = "12px";

  const b = el("button", "btn", t("ota.install"));
  b.style.marginTop = "12px";
  b.disabled = true;

  /* La barra e una riga sola: non serve una libreria per dire "a che
     punto siamo". */
  const barra = el("div");
  barra.style.cssText = "height:6px;border-radius:3px;background:#2a2f3a;" +
                        "margin-top:12px;overflow:hidden;display:none";
  const dentro = el("div");
  dentro.style.cssText = "height:100%;width:0;background:var(--acc,#e6a33a);" +
                         "transition:width .2s";
  barra.append(dentro);

  const stato = el("div", "hint");
  stato.style.marginTop = "8px";

  scegli.onchange = () => {
    b.disabled = !scegli.files.length;
    stato.textContent = scegli.files.length
      ? `${scegli.files[0].name} — ${Math.round(scegli.files[0].size / 1024)} kB`
      : "";
  };

  b.onclick = () => {
    const file = scegli.files[0];
    if (!file) return;
    b.disabled = true;
    scegli.disabled = true;
    barra.style.display = "block";
    stato.textContent = t("ota.sending");

    const x = new XMLHttpRequest();
    x.open("POST", "/api/ota");
    x.setRequestHeader("Content-Type", "application/octet-stream");

    x.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      dentro.style.width = Math.round((e.loaded / e.total) * 100) + "%";
    };

    x.onload = () => {
      let j = {};
      try { j = JSON.parse(x.responseText); } catch (e) {}
      if (x.status === 200) {
        dentro.style.width = "100%";
        stato.textContent = t("ota.done");
      } else {
        barra.style.display = "none";
        b.disabled = false;
        scegli.disabled = false;
        /* Il motivo per intero: "aggiornamento fallito" manderebbe a
           riprovare lo stesso file. */
        stato.textContent = t("ota.failed", { reason: j.error || t("page.no_reason") });
      }
    };

    x.onerror = () => {
      barra.style.display = "none";
      b.disabled = false;
      scegli.disabled = false;
      stato.textContent = t("ota.no_answer");
    };

    x.send(file);
  };

  cb.append(scegli, b, barra, stato);
  card.append(ch, cb);
  dove.append(card);
}

/* --- ripristino di fabbrica ---------------------------------------------
 *
 * In fondo alla pagina, da solo, dietro due gesti. Non e diffidenza verso
 * chi lo preme: e che da qui non si vede il pannello. Chi lo tocca sul
 * vetro ha l'apparecchio davanti e sa dove andare a rimetterlo in piedi;
 * chi lo preme dal divano scopre dopo che deve alzarsi, e allora conviene
 * che il secondo gesto glielo ricordi mentre e ancora in tempo. */
function schedaRipristino(dove) {
  const card = el("div", "card");
  const ch = el("div", "ch");
  ch.append(el("div", "t", t("reset.title")));
  ch.append(el("div", "s", t("reset.subtitle")));
  const cb = el("div", "cb");

  cb.append(el("div", "hint", t("reset.hint")));

  const b = el("button", "btn danger", t("reset.button"));
  b.style.marginTop = "12px";

  const stato = el("div", "hint");
  stato.style.marginTop = "8px";

  /* Due gesti, e il secondo dice cosa succede: "Confermi?" da solo non
     informa nessuno. Torna al primo da solo dopo dieci secondi, cosi un
     pulsante armato non resta armato mentre si guarda altro. */
  let armato = null;
  b.onclick = async () => {
    if (!armato) {
      b.textContent = t("reset.confirm");
      stato.textContent = t("reset.ten_seconds");
      armato = setTimeout(() => {
        armato = null;
        b.textContent = t("reset.button");
        stato.textContent = "";
      }, 10000);
      return;
    }
    clearTimeout(armato);
    armato = null;
    b.disabled = true;
    b.textContent = t("reset.running");
    stato.textContent = "";
    try {
      const r = await fetch("/api/reset", { method: "POST" });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        b.textContent = t("reset.done");
        stato.textContent = t("reset.done_text");
      } else {
        b.disabled = false;
        b.textContent = t("reset.button");
        /* Il pannello dice **cosa** non e riuscito, e conviene ripeterlo:
           un "non riuscito" senza motivo lascia chi legge a chiedersi se
           qualcosa sia stato cancellato a meta. */
        stato.textContent = t("reset.failed", { reason: j.error || t("page.no_reason") });
      }
    } catch (e) {
      b.disabled = false;
      b.textContent = t("reset.button");
      stato.textContent = t("reset.no_answer");
    }
  };

  cb.append(b, stato);
  card.append(ch, cb);
  dove.append(card);
}

/* --- translations --------------------------------------------------------
 *
 * Every text of the panel and of this page, in every language the firmware
 * has. What is saved here is kept on the panel and takes the place of the
 * built-in text (main/cfg/translations.c); «Export file» gives the whole
 * language back as i18n/<code>.json, edits included, to put in the project.
 *
 * The checks are the build's and the panel's, repeated here so that they
 * speak while the text is typed: the same placeholders as English — %d,
 * %s for the panel, {name} for this page — and for the panel only the
 * characters its fonts can draw. The panel checks again at save: this is
 * for saying it early, not for trusting the browser.
 *
 * Unsaved edits live in TR.edits, one entry per text and plural form, and
 * survive moving to another section: they are lost only by changing the
 * language being edited, after a question, or by leaving the page. */
const TR = {
  lang: "",            /* the language being edited */
  data: null,          /* /api/texts?edit=1 */
  part: "panel",       /* "panel" or "web" */
  show: "all",         /* "all", "edited", "stale" */
  search: "",
  edits: new Map(),    /* "part|key|form" -> text, or null: back to built-in */
  errors: {},          /* same ids -> why not */
  shown: 200,
  message: "", messageClass: "",
};
/* gen_texts.py's PRINTF_RE and NAMED_RE, the same characters. */
const PRINTF_RE = /%(?:%|[-+ #0]*(?:\d+|\*)?(?:\.(?:\d+|\*))?(?:hh|h|ll|l|z|j|t|L)?[diouxXeEfFgGaAcsp])/g;
const NAMED_RE = /\{([a-z_][a-z0-9_]*)\}/g;
const FORMS = ["one", "other"];
const TR_BATCH = 30000;     /* bytes per POST, under the panel's 32 KB */

const trId = (part, key, form) => `${part}|${key}|${form || ""}`;
const trPick = (v, form) => (v == null ? undefined : form ? v[form] : v);
/* English, the built-in text, what the panel has, what the box has. */
const trEnglish = (e, f) => trPick(e.en !== undefined ? e.en : e.base, f);
const trBase = (e, f) => trPick(e.base, f);
function trSaved(e, f) {
  const c = trPick(e.custom, f);
  return typeof c === "string" ? c : trBase(e, f);
}
function trNow(part, key, e, f) {
  const id = trId(part, key, f);
  if (!TR.edits.has(id)) return trSaved(e, f);
  const v = TR.edits.get(id);
  return v === null ? trBase(e, f) : v;
}

function trDrawable(cp) {
  return (TR.data.glyphs || []).some(([a, b]) => cp >= a && cp <= b);
}

/* Why `s` cannot stand for `en`, or null. */
function trCheck(part, key, en, s) {
  if (new TextEncoder().encode(s).length > 1024) return t("tr.check.long");
  if (part === "web") {
    const names = x => [...x.matchAll(NAMED_RE)].map(m => m[1]).sort();
    const a = names(en), b = names(s);
    return a.join(",") === b.join(",") ? null
      : t("tr.check.named", { expected: a.length ? a.map(x => `{${x}}`).join(" ") : t("tr.none_expected") });
  }
  const a = en.match(PRINTF_RE) || [], b = s.match(PRINTF_RE) || [];
  if (a.join("") !== b.join(""))
    return t("tr.check.printf", { expected: a.length ? a.join(" ") : t("tr.none_expected") });
  const bad = [...new Set([...s].filter(ch => !trDrawable(ch.codePointAt(0))))];
  if (bad.length) return t("tr.check.glyph", { chars: bad.join(" ") });
  if (key === "keyboard.letters"
      && !(/^[a-z]{1,12}\|[a-z]{1,12}\|[a-z]{1,12}$/.test(s)
           && new Set(s.replace(/\|/g, "")).size === 26))
    return t("tr.check.keyboard");
  return null;
}

async function trLoad() {
  const r = await fetch(`/api/texts?lang=${encodeURIComponent(TR.lang)}&edit=1`);
  if (!r.ok) throw new Error(String(r.status));
  TR.data = await r.json();
  TR.errors = {};
}

function trSay(message, cls) {
  TR.message = message;
  TR.messageClass = cls || "";
  const m = document.getElementById("trMsg");
  if (m) { m.textContent = message; m.className = "trmsg " + TR.messageClass; }
}

/* The unsaved count and the save button. Only the errors of edits block:
   a saved edit that no longer passes shows its error, and is not in use
   anyway until someone touches it. */
function trStatus() {
  const n = TR.edits.size;
  const bad = Object.keys(TR.errors).filter(id => TR.edits.has(id)).length;
  const s = document.getElementById("trSave");
  if (s) s.disabled = !n || bad > 0;
  const c = document.getElementById("trPending");
  if (c) c.textContent = bad ? tn("tr.invalid", bad) : n ? tn("tr.unsaved", n) : "";
}

function trEntries() {
  const d = (TR.data && TR.data[TR.part]) || {};
  const q = TR.search.trim().toLowerCase();
  const out = [];
  for (const key of Object.keys(d).sort()) {
    const e = d[key];
    const forms = e.base && typeof e.base === "object" ? FORMS : [""];
    const edited = e.custom !== undefined
      || forms.some(f => TR.edits.has(trId(TR.part, key, f)));
    if (TR.show === "edited" && !edited) continue;
    if (TR.show === "stale" && !e.stale) continue;
    if (q) {
      const hay = [key, ...forms.flatMap(f =>
        [trEnglish(e, f), trBase(e, f), trNow(TR.part, key, e, f)])].join("\n").toLowerCase();
      if (!hay.includes(q)) continue;
    }
    out.push([key, e, forms]);
  }
  return out;
}

function trRow(key, e, forms) {
  const part = TR.part;
  const r = el("div", "trr");
  const head = el("div", "trk");
  head.append(el("span", null, key));
  const tags = el("span");
  head.append(tags);
  const redoTags = () => {
    tags.textContent = "";
    const pending = forms.some(f => TR.edits.has(trId(part, key, f)));
    if (e.stale) {
      const s = el("span", "tag ko", t("tr.stale_tag"));
      s.title = t("tr.stale");
      tags.append(s);
    }
    if (pending || e.custom !== undefined)
      tags.append(el("span", "tag", pending ? t("tr.unsaved_tag") : t("tr.edited")));
  };
  const back = el("button", "btn sm", t("tr.reset_one"));
  back.onclick = () => {
    for (const f of forms) {
      const id = trId(part, key, f);
      if (typeof trPick(e.custom, f) === "string") TR.edits.set(id, null);
      else TR.edits.delete(id);
    }
    trDrawList();
  };
  back.hidden = e.custom === undefined && !forms.some(f => TR.edits.has(trId(part, key, f)));
  head.append(back);
  r.append(head);

  for (const f of forms) {
    if (f) r.append(el("div", "forma", t(`tr.form.${f}`)));
    if (TR.lang !== "en") r.append(el("div", "tren", trEnglish(e, f)));
    const i = document.createElement("textarea");
    i.value = trNow(part, key, e, f);
    i.lang = TR.lang;
    const fit = () => {
      i.rows = Math.min(10, Math.max(1, Math.ceil(i.value.length / 80)
                                        + (i.value.match(/\n/g) || []).length));
    };
    fit();
    const base = el("div", "base");
    const m = el("div", "errmsg");
    const verify = () => {
      const id = trId(part, key, f);
      const why = trCheck(part, key, trEnglish(e, f), i.value);
      if (why) TR.errors[id] = why; else delete TR.errors[id];
      i.classList.toggle("err", !!why);
      m.textContent = why || "";
      /* The built-in text under the box, when the box says something
         else: what "back to the built-in text" would give. */
      base.textContent = i.value !== trBase(e, f) ? t("tr.builtin", { text: trBase(e, f) }) : "";
    };
    i.oninput = () => {
      const id = trId(part, key, f);
      if (i.value === trSaved(e, f)) TR.edits.delete(id); else TR.edits.set(id, i.value);
      back.hidden = e.custom === undefined && !forms.some(g => TR.edits.has(trId(part, key, g)));
      fit(); verify(); redoTags(); trStatus();
    };
    verify();
    r.append(i, base, m);
  }
  redoTags();
  return r;
}

function trDrawList() {
  const lb = document.getElementById("trList");
  if (!lb) return;
  lb.textContent = "";
  const all = trEntries();
  lb.append(el("div", "trcount",
    t("tr.count", { shown: Math.min(TR.shown, all.length), total: all.length })));
  if (!all.length) lb.append(el("div", "vuoto", t("tr.none_found")));
  for (const [key, e, forms] of all.slice(0, TR.shown)) lb.append(trRow(key, e, forms));
  if (all.length > TR.shown) {
    const more = el("button", "btn sm", tn("tr.more", Math.min(200, all.length - TR.shown)));
    more.style.marginTop = "12px";
    more.onclick = () => { TR.shown += 200; trDrawList(); };
    lb.append(more);
  }
  trStatus();
}

/* The edits as the panel wants them, cut into bodies it accepts. */
function trBatches() {
  const p = { panel: {}, web: {} };
  for (const [id, v] of TR.edits) {
    const [part, key, form] = id.split("|");
    if (!form) p[part][key] = v;
    else (p[part][key] = p[part][key] || {})[form] = v;
  }
  const enc = new TextEncoder(), out = [];
  let cur = { panel: {}, web: {} }, size = 32;
  for (const part of ["panel", "web"])
    for (const [k, v] of Object.entries(p[part])) {
      const n = enc.encode(JSON.stringify(k) + JSON.stringify(v)).length + 2;
      if (size + n > TR_BATCH && size > 32) {
        out.push(cur);
        cur = { panel: {}, web: {} };
        size = 32;
      }
      cur[part][k] = v;
      size += n;
    }
  if (size > 32) out.push(cur);
  return out;
}

/* After a save, the page's own texts may have changed: when they are the
   ones being edited, the page is drawn again with them. */
async function trAfterSave() {
  try { await trLoad(); } catch (e) {}
  if (TR.lang === LANG) {
    try { await loadTexts(); } catch (e) {}
    disegnaNav();
    disegna();
  } else {
    trDrawList();
  }
}

async function trSave() {
  const batches = trBatches();
  if (!batches.length) { trSay(t("tr.nothing")); return; }
  const total = TR.edits.size;
  const q = `?lang=${encodeURIComponent(TR.lang)}`;
  for (let n = 0; n < batches.length; n++) {
    trSay(t("tr.saving", { done: n + 1, total: batches.length }));
    let r;
    try {
      r = await fetch("/api/texts" + q, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(batches[n]),
      });
    } catch (e) {
      await trAfterSave();
      trSay(t("tr.no_answer"), "ko");
      return;
    }
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      await trAfterSave();
      trSay(r.status === 422
        ? t("tr.rejected", { list: (j.fields || []).map(f => `${f.field}: ${f.reason}`).join("; ") })
        : httpMessage(r.status), "ko");
      return;
    }
    /* This body is saved: its edits are no longer edits. */
    for (const part of ["panel", "web"])
      for (const k of Object.keys(batches[n][part]))
        for (const f of ["", ...FORMS]) TR.edits.delete(trId(part, k, f));
  }
  await trAfterSave();
  trSay(tn("tr.saved", total), "ok");
}

async function trExport() {
  try {
    const r = await fetch(`/api/texts/export?lang=${encodeURIComponent(TR.lang)}`);
    if (!r.ok) throw new Error(String(r.status));
    const text = await r.text();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = `${TR.lang}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    trSay(t("tr.exported", { file: `${TR.lang}.json` })
          + (TR.edits.size ? " " + t("tr.exported_unsaved") : ""), "ok");
  } catch (e) {
    trSay(t("state.no_answer"), "ko");
  }
}

function trSelect(label, options, value, onchange) {
  const f = el("div", "field");
  f.append(el("label", null, label));
  const s = document.createElement("select");
  for (const [v, text] of options) {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = text;
    s.append(o);
  }
  s.value = value;
  s.onchange = () => onchange(s);
  f.append(s);
  return f;
}

async function schedaTraduzioni(dove) {
  if (!TR.lang) TR.lang = LANG;

  const card = el("div", "card");
  const cb = el("div", "cb");
  const bar = el("div", "trbar");
  bar.append(trSelect(t("tr.language"), LANGS.map(l => [l.code, l.name]), TR.lang, async (s) => {
    if (TR.edits.size && !confirm(t("tr.discard"))) { s.value = TR.lang; return; }
    TR.lang = s.value;
    TR.edits.clear();
    TR.data = null;
    TR.shown = 200;
    trSay("");
    disegna();
  }));
  bar.append(trSelect(t("tr.part"),
    [["panel", t("tr.part.panel")], ["web", t("tr.part.web")]], TR.part,
    (s) => { TR.part = s.value; TR.shown = 200; trDrawList(); }));
  bar.append(trSelect(t("tr.show"),
    [["all", t("tr.show.all")], ["edited", t("tr.show.edited")], ["stale", t("tr.show.stale")]],
    TR.show, (s) => { TR.show = s.value; TR.shown = 200; trDrawList(); }));
  const fq = el("div", "field");
  fq.append(el("label", null, t("tr.search")));
  const q = document.createElement("input");
  q.type = "text";
  q.value = TR.search;
  q.placeholder = t("tr.search_hint");
  q.oninput = () => { TR.search = q.value; TR.shown = 200; trDrawList(); };
  fq.append(q);
  bar.append(fq);
  cb.append(bar);

  const act = el("div", "tract");
  const save = el("button", "btn acc", t("tr.save"));
  save.id = "trSave";
  save.disabled = true;
  save.onclick = trSave;
  const exp = el("button", "btn", t("tr.export"));
  exp.onclick = trExport;
  const reset = el("button", "btn danger", t("tr.reset_all"));
  /* Two gestures, like the factory reset, and for the same reason: from
     here nothing shows how many texts it undoes. */
  let armed = null;
  reset.onclick = async () => {
    if (!armed) {
      reset.textContent = t("tr.reset_confirm");
      armed = setTimeout(() => { armed = null; reset.textContent = t("tr.reset_all"); }, 10000);
      return;
    }
    clearTimeout(armed);
    armed = null;
    reset.disabled = true;
    try {
      const r = await fetch(`/api/texts/reset?lang=${encodeURIComponent(TR.lang)}`, { method: "POST" });
      if (!r.ok) throw new Error(String(r.status));
      TR.edits.clear();
      await trAfterSave();
      trSay(t("tr.reset_done"), "ok");
    } catch (e) {
      reset.disabled = false;
      reset.textContent = t("tr.reset_all");
      trSay(t("state.no_answer"), "ko");
    }
  };
  const pending = el("span", "quanti");
  pending.id = "trPending";
  act.append(save, exp, reset, pending);
  cb.append(act);
  const msg = el("div", "trmsg " + TR.messageClass, TR.message);
  msg.id = "trMsg";
  cb.append(msg);
  card.append(cb);
  dove.append(card);

  const list = el("div", "card");
  const lb = el("div", "cb");
  lb.id = "trList";
  list.append(lb);
  dove.append(list);

  if (!TR.data || TR.data.lang !== TR.lang) {
    lb.append(el("div", "vuoto", t("state.loading")));
    try { await trLoad(); }
    catch (e) {
      lb.textContent = "";
      lb.append(el("div", "vuoto", t("state.no_answer")));
      return;
    }
  }
  trDrawList();
}

/* --- disegno complessivo ------------------------------------------------ */
function disegnaNav() {
  const nav = $("#nav");
  nav.textContent = "";
  let gruppo = null;
  for (const s of SEZIONI) {
    if (s.gruppo !== gruppo) {
      gruppo = s.gruppo;
      nav.append(el("div", "gl", t(`group.${gruppo}`)));
    }
    const b = el("button", s.id === sezioneCorrente ? "sel" : null, titoloSezione(s));
    if (s.conta) {
      const v = leggi(doc, s.conta);
      b.append(el("span", "n", Array.isArray(v) ? String(v.length) : "0"));
    }
    b.onclick = () => {
      sezioneCorrente = s.id;
      history.replaceState(null, "", location.search + "#" + s.id);
      disegna();
    };
    nav.append(b);
  }
}

/* --- il contrasto, e come si guarda -------------------------------------
 *
 * La formula e quella delle WCAG, ed e la stessa che il firmware usa in
 * main/ui/tema.c per decidere se sopra l'accento ci va testo scuro o
 * chiaro: due posti che devono dare la stessa risposta, e per questo e
 * scritta uguale.
 *
 * **Si avvisa, non si impedisce.** Un pannello e di chi ce l'ha in casa, e
 * rifiutare una combinazione perche' a un algoritmo non piace vorrebbe dire
 * decidere al posto suo. Ma un pannello a muro si legge da un metro e
 * mezzo, e il contrasto sul monitor mentre si sceglie inganna: qui il
 * numero c'e, e sotto le soglie lo dice.
 */
function coloreOra(nome) {
  const s = (schema && schema.properties && schema.properties.appearance
             && schema.properties.appearance.properties) || {};
  const v = leggi(doc, "appearance." + nome);
  return (v && /^#[0-9A-Fa-f]{6}$/.test(v)) ? v
       : ((s[nome] && s[nome].default) || "#000000");
}

function luminanza(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16) / 255);
  const v = c.map(x => x <= 0.03928 ? x / 12.92
                                    : Math.pow((x + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}

function contrasto(a, b) {
  const x = luminanza(a), y = luminanza(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
}

/* Le coppie che decidono se il pannello si legge. Non tutte le
   combinazioni possibili: quelle che stanno davvero una sopra l'altra. */
/* The name of each pair is contrast.pair.<front>_on_<back>. */
const COPPIE = [
  ["text",       "background", 4.5],
  ["text",       "cards",      4.5],
  ["text_dim",   "cards",      4.5],
  ["accent",     "background", 3.0],
  ["positive",   "cards",      3.0],
  ["negative",   "cards",      3.0],
  ["lights_on",  "cards",      3.0],
];

function schedaContrasto(dove) {
  const card = el("div", "card");
  card.id = "cardContrasto";
  const ch = el("div", "ch");
  ch.append(el("div", "t", t("contrast.title")));
  ch.append(el("div", "s", t("contrast.subtitle")));
  const cb = el("div", "cb");
  cb.id = "corpoContrasto";
  card.append(ch, cb);
  dove.append(card);
  aggiornaContrasto();
}

function aggiornaContrasto() {
  const cb = document.getElementById("corpoContrasto");
  if (!cb) return;                      /* non siamo in questa scheda */
  cb.textContent = "";

  const sfondo = coloreOra("background");
  const schede = coloreOra("cards");
  const bordi = coloreOra("borders");
  const testo = coloreOra("text");
  const debole = coloreOra("text_dim");
  const accento = coloreOra("accent");

  const tab = el("table", "contr");
  for (const [davanti, dietro, soglia] of COPPIE) {
    const f = coloreOra(davanti), d = coloreOra(dietro);
    const r = contrasto(f, d);
    const tr = document.createElement("tr");

    const c1 = document.createElement("td");
    c1.textContent = t(`contrast.pair.${davanti}_on_${dietro}`);

    const c2 = document.createElement("td");
    const campione = el("span", "campione", t("contrast.sample"));
    campione.style.background = d;
    campione.style.color = f;
    c2.append(campione);

    const c3 = document.createElement("td");
    c3.textContent = r.toFixed(1) + ":1";
    c3.className = r < soglia ? "male" : (r < soglia + 1.5 ? "cosi" : "bene");
    if (r < soglia) c3.title = t("contrast.below", { ratio: soglia.toFixed(1) });

    tr.append(c1, c2, c3);
    tab.append(tr);
  }
  cb.append(tab);

  const male = COPPIE.filter(([f, d, s]) =>
      contrasto(coloreOra(f), coloreOra(d)) < s).length;
  const nota = el("div", "hint", male ? tn("contrast.bad", male) : t("contrast.good"));
  if (male) nota.style.color = "#c0392b";
  cb.append(nota);

  /* Il provino: la stessa roba che sta sul vetro, coi colori scelti. Un
     campione di colore da solo non dice niente — quello che conta e come
     stanno insieme. */
  const prov = el("div", "provino");
  prov.style.background = sfondo;
  prov.style.border = "1px solid " + bordi;

  const scheda = el("div", "scheda");
  scheda.style.background = schede;
  scheda.style.borderColor = bordi;
  const t1 = el("div", null, t("contrast.room"));
  t1.style.color = testo;
  t1.style.fontWeight = "600";
  const t2 = el("div", null, t("contrast.room_state"));
  t2.style.color = debole;
  t2.style.fontSize = "12px";
  scheda.append(t1, t2);

  const puls = el("div", "pulsante", t("contrast.button"));
  puls.style.background = accento;
  /* Come fa il firmware, e con la stessa regola: fra lo sfondo e il testo
     vince quello che si stacca di piu dall'accento. Non una soglia sulla
     luminanza — quella sceglieva la peggiore delle due su un accento di
     mezzo tono. */
  puls.style.color = contrasto(accento, sfondo) >= contrasto(accento, testo)
                   ? sfondo : testo;

  prov.append(scheda, puls);
  cb.append(prov);
}

function disegna() {
  disegnaNav();
  const p = $("#pane");
  p.textContent = "";
  const s = SEZIONI.find(x => x.id === sezioneCorrente) || SEZIONI[0];
  p.append(el("h2", null, titoloSezione(s)));
  p.append(el("p", "lead", t(`section.${s.id}.lead`)));

  if (s.speciale === "stato") { schedaStato(p); return; }
  if (s.speciale === "traduzioni") { schedaTraduzioni(p); return; }

  /* Ogni chiave dentro il suo riparo. Senza, bastava un intoppo sulla
     prima per far sparire tutte quelle dopo **e** le schede dei segreti,
     che vengono in fondo: restavano il titolo, il sommario e nient'altro.
     Sembra una scelta di chi l'ha scritta, ed e un errore — che e il modo
     peggiore di sbagliare. Una pagina di configurazione deve saper dire
     "questo pezzo non l'ho disegnato, ed ecco perche". */
  for (const chiave of (s.chiavi || [])) {
    const sub = sottoschema(chiave);
    if (!sub) continue;                 /* lo schema non la conosce: si salta */
    try { disegnaChiave(chiave, sub, p); }
    catch (e) { p.append(schedaGuasta(chiave, e)); }
  }

  if (s.contrasto) {
    try { schedaContrasto(p); }
    catch (e) { p.append(schedaGuasta("contrasto", e)); }
  }

  if (s.segreti) {
    try { schedaSegreti(s.segreti, p); }
    catch (e) { p.append(schedaGuasta("segreti", e)); }
  }
  mostraErrori();
}

/* Il riquadro che prende il posto di una scheda che non si e potuta
   disegnare. Porta il messaggio vero: e l'unica cosa che permette di
   capire, stando qui, cosa c'e di storto nella configurazione. */
function schedaGuasta(chiave, e) {
  const card = el("div", "card");
  const ch = el("div", "ch");
  ch.append(el("div", "t", etichetta(chiave, chiave.split(".").pop())));
  ch.append(el("div", "s", t("broken.subtitle")));
  const cb = el("div", "cb");
  const m = el("div", "hint",
    t("broken.text", { error: e && e.message ? e.message : String(e) }));
  m.style.color = "var(--ko, #e5484d)";
  cb.append(m);
  cb.append(el("div", "hint", t("broken.rest")));

  /* Quando si sa **quale** ramo e rotto, si puo offrire di rifarlo. E una
     cancellazione, quindi la si dice per intero e la si fa premere: il
     valore che c'e adesso non lo capiamo, ma e comunque roba di chi
     configura, e non sta a questa pagina decidere di buttarla. */
  if (e && e.ramo) {
    const b = el("button", "btn sm danger", t("broken.empty", { branch: e.ramo }));
    b.style.marginTop = "10px";
    b.onclick = () => {
      const dentro = e.ramo.split(".");
      const ultimo = dentro.pop();
      let o = doc;
      for (const k of dentro) o = o[k];
      o[ultimo] = {};
      cambiato();
      disegna();
    };
    cb.append(b);
    cb.append(el("div", "hint", t("broken.empty_hint")));
  }
  card.append(ch, cb);
  return card;
}

function disegnaChiave(chiave, sub, p) {
    if (sub.type === "array" && sub.items && sub.items.type === "object") {
      const card = el("div", "card");
      const ch = el("div", "ch");
      ch.append(el("div", "t", etichetta(chiave, chiave)));
      const v = leggi(doc, chiave);
      ch.append(el("div", "s", tn("list.count", Array.isArray(v) ? v.length : 0)));
      const cb = el("div", "cb");
      righeArray(chiave, sub, cb);
      card.append(ch, cb); p.append(card);
    } else if (sub.type === "array") {
      const card = el("div", "card");
      const ch = el("div", "ch"); ch.append(el("div", "t", etichetta(chiave, chiave)));
      const cb = el("div", "cb");
      elencoTesti(chiave, sub, cb);
      card.append(ch, cb); p.append(card);
    } else if (sub.type === "object") {
      schedaOggetto(etichetta(chiave, chiave), chiave, sub, p);
    } else {
      const card = el("div", "card");
      const cb = el("div", "cb");
      campoSemplice(chiave, sub, cb);
      card.append(cb); p.append(card);
    }
}

function mostraErrori() {
  const errori = { ...validaTutto(), ...erroriDalPannello };
  for (const f of document.querySelectorAll(".field[data-percorso]")) {
    const p = f.dataset.percorso;
    const i = f.querySelector("input,select");
    const m = f.querySelector(".errmsg");
    if (i) i.classList.remove("err");
    if (m) { m.textContent = ""; m.style.color = ""; }
    if (errori[p]) {
      if (i) i.classList.add("err");
      if (m) m.textContent = errori[p];
    } else if (avvisiDalPannello[p] && m) {
      m.textContent = avvisiDalPannello[p];
      m.style.color = "var(--warn)";
    }
  }
  return errori;
}

/* --- dire *quali* campi, non quanti --------------------------------------
 *
 * «2 campi non validi» e' un numero senza indirizzo: il pulsante «Salva»
 * resta spento e non c'e' modo di sapere dove guardare, perche' la riga
 * rossa sta dentro una scheda che magari e' chiusa e che non si ha nessun
 * motivo di aprire. E' successo davvero, e ha fatto sembrare rotto il
 * pulsante invece che sbagliato un campo — in una sezione che chi guardava
 * non aveva nemmeno aperto.
 *
 * Adesso si scrive **la scheda e il campo**: «Lavatrice e asciugatrice →
 * Watt a pieno carico (riga 1)». Oltre tre si tronca con «e altri N», che
 * e' l'unico caso in cui un numero serve piu' di un nome. */
function schedaDi(percorso) {
  const radice = percorso.split(".")[0];
  for (const s of SEZIONI)
    if ((s.chiavi || []).includes(radice)) return titoloSezione(s);
  return radice;
}

function doveSta(percorso) {
  const pezzi = percorso.split(".");
  const chiave = pezzi[pezzi.length - 1];
  /* L'indice della riga, se il campo sta dentro un elenco: senza, davanti a
     dodici zone di clima si sa quale campo ma non quale riga. Si mostra a
     partire da uno, come la colonna dei numeri accanto alle righe. */
  const riga = pezzi.length >= 2 && /^\d+$/.test(pezzi[pezzi.length - 2])
             ? " " + t("where.row", { n: Number(pezzi[pezzi.length - 2]) + 1 }) : "";

  /* Il gruppo che contiene la riga, quando gli elenchi sono annidati.
     «Programmazioni → Accensione (riga 2)» con sei gruppi non basta: la
     riga 2 di quale? Si nomina il gruppo se ce l'ha un nome, se no il suo
     numero — che e' comunque piu' di niente. L'ultimo indice e' della riga
     e non si ripete. */
  const dentro = [];
  for (let n = 0; n < pezzi.length - 2; n++) {
    if (!/^\d+$/.test(pezzi[n])) continue;
    const o = leggi(doc, pezzi.slice(0, n + 1).join("."));
    dentro.push(o && typeof o.name === "string" && o.name
                ? o.name : `${etichetta(pezzi.slice(0, n).join("."), pezzi[n - 1])} ${Number(pezzi[n]) + 1}`);
  }
  const strada = dentro.length ? dentro.join(" → ") + " → " : "";
  return `${schedaDi(percorso)} → ${strada}${etichetta(percorso, chiave)}${riga}`;
}

function elencoErrori(errori) {
  const p = Object.keys(errori);
  const primi = p.slice(0, 3).map(doveSta);
  return primi.join("; ") + (p.length > 3 ? "; " + tn("where.more", p.length - 3) : "");
}

/* --- modifiche non salvate ---------------------------------------------- */
function quanteModifiche() {
  try {
    const a = JSON.parse(originale), b = doc;
    let n = 0;
    const confronta = (x, y, base) => {
      const chiavi = new Set([...Object.keys(x || {}), ...Object.keys(y || {})]);
      for (const k of chiavi) {
        const vx = x ? x[k] : undefined, vy = y ? y[k] : undefined;
        if (vx && vy && typeof vx === "object" && typeof vy === "object")
          confronta(vx, vy, `${base}.${k}`);
        else if (JSON.stringify(vx) !== JSON.stringify(vy)) n++;
      }
    };
    confronta(a, b, "");
    return n;
  } catch (e) { return 0; }
}

/* --- importare un documento intero --------------------------------------
 *
 * Una configurazione di casa e qualche centinaio di campi: comporla a mano
 * nella pagina, la prima volta, e un pomeriggio. Il file c'e gia — si scrive
 * a fianco del progetto, si esporta da un altro pannello, si tiene in un
 * backup — e serviva solo il modo di consegnarlo.
 *
 * L'esportazione esisteva da sempre e l'importazione no, che e il genere di
 * asimmetria che nessuno nota finche non tocca a lui rimettere dentro quello
 * che aveva tirato fuori.
 *
 * **Non salva.** Il file diventa il documento in modifica, la pagina lo
 * rilegge e lo mostra campo per campo, e a quel punto si vede cosa e stato
 * accettato — e cosa il pannello contesta — prima di premere Salva. Un
 * pulsante che scrivesse dritto in flash toglierebbe l'unico momento in cui
 * ci si accorge di aver preso il file sbagliato. */
function importa(testo) {
  const st = $("#stato");
  let nuovo;
  try {
    nuovo = JSON.parse(testo);
  } catch (e) {
    st.className = "stato ko";
    st.textContent = t("state.not_json", { error: e.message });
    return;
  }
  if (typeof nuovo !== "object" || nuovo === null || Array.isArray(nuovo)) {
    st.className = "stato ko";
    st.textContent = t("state.not_config");
    return;
  }

  doc = raddrizza(schema, nuovo);
  disegna();
  cambiato();

  /* Se cambiato() ha gia scritto un errore non gli si passa sopra: sapere
     che il file e entrato conta meno che sapere che ha dei campi da
     sistemare. */
  if (!st.classList.contains("ko")) {
    st.className = "stato";
    st.textContent = t("state.imported");
  }
}

function cambiato() {
  erroriDalPannello = {};
  avvisiDalPannello = {};
  const errori = mostraErrori();
  const n = quanteModifiche();
  const quanti = Object.keys(errori).length;
  const st = $("#stato");
  $("#annulla").disabled = n === 0;
  $("#salva").disabled = n === 0 || quanti > 0;
  if (quanti) {
    st.className = "stato ko";
    st.textContent = tn("state.invalid", quanti, { list: elencoErrori(errori) });
  } else if (n) {
    st.className = "stato mod";
    st.textContent = tn("state.unsaved", n);
  } else {
    st.className = "stato";
    st.textContent = t("state.none");
  }
}

/* --- dialogo col pannello ----------------------------------------------- */
/* --- the new Wi-Fi network, tried with a safety net -----------------------
 *
 * The panel tries a new network thirty seconds after the last change and,
 * if it does not connect within a minute, goes back to the previous one.
 * The page says so: after a save, so that whoever just changed the password
 * knows the page may soon stop answering, and on opening, so that whoever
 * comes back after a failed trial knows the panel put things back. */
function mostraReteNuova(st) {
  const stato = st && st.network_trial;
  $("#barra-rete").hidden = !stato;
  $("#testo-rete").textContent = stato
    ? t(`network_trial.${stato}`, { s: st.network_trial_in_s || 0 }) : "";
}

async function guardaReteNuova() {
  try { mostraReteNuova(await (await fetch("/api/status")).json()); } catch (e) {}
}

async function inviaSegreti(coppie) {
  const st = $("#stato");
  try {
    const r = await fetch("/api/secrets", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(coppie),
    });
    const esito = await r.json();
    Object.assign(statoSegreti, esito);
    st.className = "stato ok";
    st.textContent = t("secret.updated");
    disegna();
    /* A second of margin: /api/status answers at most once a second per
       caller, and the page may just have asked. */
    setTimeout(guardaReteNuova, 1100);
  } catch (e) {
    st.className = "stato ko";
    st.textContent = t("state.no_answer");
  }
}

async function salva() {
  const st = $("#stato");
  st.className = "stato";
  st.textContent = t("state.sending");
  let r;
  try {
    /* §2.1: si manda il documento intero, non le differenze. */
    r = await fetch("/api/config", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify(doc),
    });
  } catch (e) {
    st.className = "stato ko";
    st.textContent = t("state.not_saved");
    return;
  }

  if (r.ok) {
    originale = JSON.stringify(doc);
    erroriDalPannello = {};
    cambiato();
    $("#stato").className = "stato ok";
    $("#stato").textContent = t("state.saved");
    setTimeout(guardaReteNuova, 1100);
    return;
  }

  if (r.status === 422) {
    const esito = await r.json();
    erroriDalPannello = {};
    for (const c of (esito.fields || []))
      erroriDalPannello[c.field.split("/").join(".")] = c.reason;
    /* Gli avvisi non sono rifiuti: si mostrano, non bloccano. */
    avvisiDalPannello = {};
    for (const c of (esito.warnings || []))
      avvisiDalPannello[c.field.split("/").join(".")] = c.reason;
    mostraErrori();
    st.className = "stato ko";
    const n = (esito.fields || []).length;
    st.textContent = tn("state.rejected", n);
    return;
  }

  st.className = "stato ko";
  st.textContent = httpMessage(r.status);
}

/* What an unexpected status means. A 404 from a page that answered a
   moment ago is the configuration window having closed: said so, instead
   of a number. */
function httpMessage(status) {
  return status === 404 ? t("state.window_closed") : t("state.http", { status });
}

/* --- here there was the unlock countdown -----------------------------------
 *
 * A yellow band said "closes in 14:57", and the number was made up: it
 * started from fifteen minutes at every load of the page, whatever the
 * panel knew, and with the configuration kept always open it never closed
 * at all. A countdown that restarts at every reload is a false one, and on
 * a phone it took three lines.
 *
 * When the window really closes it is said when it matters: at the save,
 * which comes back 404 — see httpMessage(). */

/* Lo schema usa $ref per non ripetere la forma di una rete condivisibile —
   ospiti e private sono la stessa cosa — ma questa pagina guarda `type` e
   `properties` per decidere che campo disegnare, e un $ref non ne ha
   nessuno dei due. Finiva fra i campi semplici, cioe fra i campi di testo:
   la rete ospiti compariva come una casella vuota che non configurava
   niente, ed e il motivo per cui il nome della rete ospiti non si poteva
   cambiare da nessuna parte.

   Si srotola una volta sola, appena arrivato. Le definizioni di questo
   schema non si richiamano fra loro, quindi srotolarle finisce. */
function srotola(nodo, radice) {
  if (Array.isArray(nodo)) return nodo.map(x => srotola(x, radice));
  if (!nodo || typeof nodo !== "object") return nodo;

  if (typeof nodo.$ref === "string") {
    const pezzi = nodo.$ref.replace(/^#\//, "").split("/");
    let d = radice;
    for (const k of pezzi) d = d && d[k];
    if (!d) return nodo;
    /* Quello che stava accanto al $ref vince: e li per precisare. */
    const { $ref, ...resto } = nodo;
    return srotola({ ...d, ...resto }, radice);
  }

  const fuori = {};
  for (const [k, v] of Object.entries(nodo)) fuori[k] = srotola(v, radice);
  return fuori;
}

/* --- the header ------------------------------------------------------------
 * Name and connection, from /api/status. Kept, so that changing language
 * redraws it without asking the panel again. Version, revision and profile
 * are no longer here: they are in «Status and log» and on the panel in
 * Settings › Information, and at the top of every page they took two lines
 * on a phone. */
let panelStatus = null;

function drawHeader() {
  const st = panelStatus;
  /* The panel's name, or the project's: a proper name, not a text. */
  $("#nome-pannello").textContent = (st && st.panel) || "Foyer Panel";
  if (!st) return;
  const pill = $("#stato-ha");
  pill.className = st.ha_state === "connected" ? "pill ok" : "pill";
  /* "Home Assistant" is a name and stays in the HTML, hidden on a phone;
     only the state is a text. */
  $("#stato-ha-testo").textContent =
    st.ha_state ? (tIf("ha.state." + st.ha_state) || st.ha_state) : "—";
}

/* --- avvio -------------------------------------------------------------- */
async function avvia() {
  $("#stato").textContent = t("state.loading");
  try {
    await loadTexts();
    const [s, c] = await Promise.all([
      fetch("/api/schema").then(r => r.json()),
      fetch("/api/config").then(r => r.json()),
    ]);
    schema = srotola(s, s);
    doc = raddrizza(schema, c);
    /* `originale` si prende **dopo** aver raddrizzato: se no il confronto
       con l'originale conterebbe la conversione come una modifica, e il
       pulsante «Salva» si accenderebbe da solo su una pagina appena
       aperta. */
    originale = JSON.stringify(doc);
  } catch (e) {
    $("#stato").className = "stato ko";
    $("#stato").textContent = t("state.unreachable");
    return;
  }

  try { statoSegreti = await (await fetch("/api/secrets")).json(); } catch (e) {}

  /* Non si aspetta: la pagina si disegna subito e le tendine si riempiono
     quando l'elenco arriva. Aspettarlo vorrebbe dire una pagina bianca per
     il giro sul WebSocket, in cambio di un suggerimento. */
  caricaEntita(false);

  try {
    panelStatus = await (await fetch("/api/status")).json();
    mostraReteNuova(panelStatus);

    /* La porta tenuta aperta si dice qui, in alto e in giallo: chi apre
       questa pagina senza aver toccato niente sul vetro deve capire subito
       **perche** ci e riuscito, se no la barriera sembra non esserci mai
       stata. */
    /* Qui c'era una fascia rossa fissa sulla deroga «configurazione sempre
       aperta». Tolta su richiesta: e' una decisione presa e dichiarata, e
       una fascia che non si puo' chiudere smette di essere un avviso e
       diventa arredamento — si impara a non vederla, e con lei si impara a
       non vedere quel posto della pagina.
       Il pannello continua a dirlo dove serve: la riga nelle impostazioni a
       bordo e l'avviso nel registro a ogni avvio (12-sicurezza.md §3). */
    drawHeader();
  } catch (e) {}

  disegna();
  cambiato();
}

$("#salva").onclick = salva;

/* Another language for the page: the texts again, and everything drawn
   again with them. The document being edited is not touched. */
$("#lingua-pagina").onchange = async () => {
  chosenLang = $("#lingua-pagina").value;
  history.replaceState(null, "", "?lang=" + encodeURIComponent(chosenLang) + location.hash);
  try { await loadTexts(); } catch (e) { return; }
  disegna();
  cambiato();
};
caricaStanzeRobot();

/* --- esportare il documento --------------------------------------------
 *
 * L'importazione c'era e l'esportazione no: si poteva leggere /api/config
 * con uno strumento da riga di comando, che non e un modo di chiedere a
 * qualcuno di farsi una copia della propria configurazione.
 *
 * Si esporta **quello che si vede**, modifiche comprese, e non quello che
 * il pannello ha in flash: chi esporta dopo aver corretto dei campi si
 * aspetta di ritrovarseli corretti, e un file che tornasse indietro alla
 * versione salvata sarebbe una sorpresa scoperta il giorno del ripristino.
 *
 * I segreti non ci sono e non e una dimenticanza: il pannello non li
 * restituisce a nessuno, quindi il file esce senza. 03-config-contratto.md
 * §1 — un token dentro un file che si copia e un token perso. */
function esportaFile() {
  const testo = JSON.stringify(doc, null, 2);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([testo], { type: "application/json" }));
  a.download = "config.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  const st = $("#stato");
  st.className = "stato";
  st.textContent = t("state.exported");
}

$("#file").onchange = () => {
  const f = $("#file").files[0];
  if (!f) return;
  const lettore = new FileReader();
  lettore.onload = () => importa(lettore.result);
  lettore.readAsText(f);
  /* Azzerato, se no ricaricare **lo stesso** file non scatena onchange e
     sembra che il pulsante si sia rotto. */
  $("#file").value = "";
};
$("#annulla").onclick = () => {
  doc = JSON.parse(originale);
  erroriDalPannello = {};
  disegna();
  cambiato();
};

avvia();
</script>
