# =============================================================
# THE DAY'S FOUR TOTALS — the panel's Energy section
#
# At the bottom the panel shows four numbers: produced, consumed,
# drawn from the grid, fed into the grid. They are **energy**
# (kWh), not power, and they answer a different question from the
# numbers at the top: not "how much now" but "how much today".
#
# One you probably have already — `sensor.pv_energy_today` for
# what was produced. The other three are built here; the "House
# power" sensor the first one needs is further up, next to the
# aggregate it copies the formula from.
#
# -------------------------------------------------------------
# BEFORE PASTING, two things to check in
# Developer tools -> States:
#
#   1. `sensor.grid_import_total` and `sensor.grid_export_total`
#      must be **cumulative counters in kWh** (state_class:
#      total_increasing), not instantaneous power. Most meter
#      integrations provide them; checking takes ten seconds, and
#      getting it wrong costs a day of absurd numbers.
#
#   2. `sensor.grid_power` must be in W, positive when you
#      **draw** from the grid. That is the convention the panel
#      has in its configuration (`energy.signs.grid_positive:
#      import`).
# -------------------------------------------------------------

# --- 1. from power to energy ----------------------------------
#
# A Riemann sum: watts are accumulated over time and give
# watt-hours. `unit_prefix: k` turns them into kWh, the unit the
# panel expects the totals in.
#
# `max_sub_interval` is not a detail: without it the integration
# adds a piece **only when the source changes**, and a power that
# stays still for twenty minutes — it happens at night — counts
# zero instead of twenty minutes of steady consumption. With a
# one-minute maximum step, the count goes on even when the sensor
# does not move.
#
# `method: left` instead of the trapezoid: on a power that changes
# in steps the trapezoid cuts the corners and rounds up on the
# peaks. Left is slightly conservative, which on a counter is the
# right way to be wrong.

sensor:
  - platform: integration
    source: sensor.house_power
    name: "House energy"
    unique_id: house_energy
    unit_prefix: k
    unit_time: h
    method: left
    max_sub_interval: "00:01:00"

# --- 2. the three counters that reset at midnight -------------
#
# `cycle: daily` resets at local time, the same midnight the panel
# asks the day's curve from.
#
# Grid import and export start from the meter's counters, which
# are already cumulative: nothing is integrated here, the
# difference from the start of the day is taken. It is the most
# precise count there is, because it goes through no
# approximation.
utility_meter:
  house_consumption_today:
    source: sensor.house_energy
    name: "House consumption today"
    cycle: daily

  grid_import_today:
    source: sensor.grid_import_total
    name: "Grid import today"
    cycle: daily

  grid_export_today:
    source: sensor.grid_export_total
    name: "Grid export today"
    cycle: daily

# --- 3. and then, on the panel's page -------------------------
#
# Energy -> The day's totals:
#
#   Produced today       sensor.pv_energy_today           (already there)
#   Consumed today       sensor.house_consumption_today
#   Drawn from the grid  sensor.grid_import_today
#   Fed into the grid    sensor.grid_export_today
#
# Home Assistant derives the ids from the names: check them in
# Developer tools after the restart, because if a similar name
# already exists the new one ends up with a `_2` at the end.
#
# The first numbers appear as the day goes by: a daily counter
# that has just been created starts from zero and knows nothing of
# the hours already gone. Tomorrow morning they will be full.
