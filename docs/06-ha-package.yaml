# =============================================================
# Home Assistant package for Foyer Panel
#
# MIND THE FILE NAME
# Copy it as  /config/packages/foyer_panel.yaml
# NOT as 06-ha-package.yaml: with !include_dir_named the file
# name becomes the package name and must be a valid slug, so no
# hyphens and no leading digits. Otherwise:
#   Invalid package definition ... invalid slug
#
# If you do not use packages yet, add to configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#
# IT IS AN EXAMPLE: the energy entity_ids are made up, for a
# system with solar panels, a home battery and a grid meter.
# Their names depend on your integration: replace them with
# yours, and the people with your person entities.
#
# The attribute names are English since schema 11 (people, list,
# house_w, grid_w...). A package installed earlier, with the
# Italian names (persone, elenco, casa, rete_w...), keeps working:
# the panel reads the English name first and then the Italian one.
# =============================================================

template:

  - sensor:

      # -------------------------------------------------------
      # OPENINGS — doors and windows with a contact sensor
      # Contact sensors usually have device_class "door" or
      # "window". A garage door has device_class "garage_door"
      # and is left out: it has its own row in the Access screen.
      # -------------------------------------------------------
      - name: "Panel openings"
        unique_id: panel_openings
        state: >
          {{ states.binary_sensor
             | selectattr('attributes.device_class', 'defined')
             | selectattr('attributes.device_class', 'in', ['door', 'window'])
             | selectattr('state', 'eq', 'on') | list | count }}
        attributes:
          list: >
            {{ states.binary_sensor
               | selectattr('attributes.device_class', 'defined')
               | selectattr('attributes.device_class', 'in', ['door', 'window'])
               | selectattr('state', 'eq', 'on')
               | map(attribute='name') | list }}

      # -------------------------------------------------------
      # LIGHTS ON — the light domain only.
      # Many lights also exist as a switch (smart relays often
      # create both entities): counting only light avoids
      # counting them twice.
      # -------------------------------------------------------
      - name: "Panel lights on"
        unique_id: panel_lights_on
        state: >
          {{ states.light | selectattr('state', 'eq', 'on') | list | count }}
        attributes:
          list: >
            {{ states.light | selectattr('state', 'eq', 'on')
               | map(attribute='name') | list }}

      # -------------------------------------------------------
      # PRESENCE
      # An explicit list and not every person entity: that way a
      # duplicated person or a guest does not end up on the panel.
      # -------------------------------------------------------
      - name: "Panel presence"
        unique_id: panel_presence
        state: >
          {% set p = ['person.person_1', 'person.person_2', 'person.person_3'] %}
          {{ p | select('is_state', 'home') | list | count }}
        attributes:
          people: >
            {% set p = ['person.person_1', 'person.person_2', 'person.person_3'] %}
            {% set ns = namespace(v=[]) %}
            {% for e in p %}
              {% set ns.v = ns.v + [{
                   'name': state_attr(e, 'friendly_name'),
                   'home': is_state(e, 'home'),
                   'since': states[e].last_changed | as_timestamp
                         | timestamp_custom('%H:%M') }] %}
            {% endfor %}
            {{ ns.v }}

      # -------------------------------------------------------
      # ENERGY — an example with solar panels and a battery
      # Replace the entity_ids with yours; check the signs on your
      # own system instead of taking them for granted.
      #
      # SIGN CONVENTION, as the system declares it:
      #   grid    > 0  drawing from the grid
      #   grid    < 0  feeding into the grid
      #   battery > 0  the battery is charging
      #   battery < 0  the battery is discharging
      #
      # Hence:  house = production + grid - battery
      #   daytime:     3420 + (-2200) -  900  =  320 W
      #   night:          0 + ( 1200) -    0  = 1200 W
      #   discharging:    0 + (  700) - (-500) = 1200 W
      # -------------------------------------------------------
      - name: "Panel energy"
        unique_id: panel_energy
        unit_of_measurement: "W"
        state: >
          {{ states('sensor.pv_power') | float(0) | round(0) }}
        attributes:
          house_w: >
            {{ (states('sensor.pv_power') | float(0)
                + states('sensor.grid_power') | float(0)
                - states('sensor.battery_power') | float(0))
               | round(0) }}
          battery_pct: >
            {{ states('sensor.battery_level') | float(0) | round(0) }}
          battery_w: >
            {{ states('sensor.battery_power') | float(0) | round(0) }}
          grid_w: >
            {{ states('sensor.grid_power') | float(0) | round(0) }}
          today_kwh: >
            {{ states('sensor.pv_energy_today') | float(0) | round(1) }}

      # --- the house's power, as an entity of its own -------------
      #
      # The house's consumption is not a sensor: it is computed, with
      # the same formula as the `house_w` attribute above. But an
      # attribute cannot be integrated — the integration wants an
      # entity with a state — so the same computation also becomes a
      # sensor of its own. It sits next to the original on purpose: if
      # one day it changes, it is plain to see that there are two and
      # they must change together.
      - name: "House power"
        unique_id: house_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.pv_power') | float(0)
              + states('sensor.grid_power') | float(0)
              - states('sensor.battery_power') | float(0))
             | round(0) }}
# =============================================================
# CALENDAR — OPTIONAL
#
