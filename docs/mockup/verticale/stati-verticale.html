<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foyer Panel · pannelli in verticale · stati e flussi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#15171b;color:#d8dce3;font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1400px;margin:0 auto;padding:18px 14px 60px}
h1.tt{font-size:15px;font-weight:600;margin:0 0 2px;color:#e6e9ee}
p.sub{font-size:12.5px;color:#8b929e;margin:0 0 14px}
.grp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
.grp .lb{font:500 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6d747f;margin-right:4px}
.grp button{appearance:none;border:1px solid #2c3038;background:#1c1f25;color:#aeb5c0;font:500 12.5px/1 Inter,sans-serif;padding:9px 12px;border-radius:8px;cursor:pointer}
.grp button:hover{border-color:#3d434e;color:#e6e9ee}
.grp button[aria-pressed="true"]{background:#e6e9ee;color:#15171b;border-color:#e6e9ee}
.wrap{display:flex;gap:26px;align-items:flex-start;margin-top:14px}
.frame{position:relative;background:#000;border:12px solid #24272d;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.5);overflow:hidden;flex:none}
.stage{transform-origin:top left;position:relative;overflow:hidden}
.caption{font-size:12.5px;color:#9aa1ad;line-height:1.65;flex:1;min-width:260px;padding-top:6px}
.caption b{color:#e6e9ee;font-weight:600}
.caption h3{font:600 13px/1.4 Inter,sans-serif;color:#e6e9ee;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  --bg:#0d1014;--card:#151a21;--card2:#11161c;--line:#1e242d;--txt:#e8ecf2;--dim:#8a95a6;
  --acc:#f0a835;--ok:#4fc39a;--cool:#57b6e0;--warn:#e2664f;--ink:#0d1014;--off:#232b35;
  --r:16px;--pad:18px;--gap:14px;--bar:112px;--head:72px;
  --f-ti:26px;--f-nm:17px;--f-val:38px;--f-s:14px;--f-lb:12px;
  background:var(--bg);color:var(--txt)}

.navbar{height:var(--bar);flex:none;display:flex;background:var(--card2);border-top:1px solid var(--line)}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#6f7b8c;border-right:1px solid rgba(255,255,255,.03)}
.nb:last-child{border-right:none}
.nb svg{width:23px;height:23px;flex:none}
.nb span{font:500 10.5px/1 Inter,sans-serif;white-space:nowrap}
.nb.home{color:var(--acc);background:var(--card)}
.nb.sel{background:#221c0e;color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
.nb.dis{opacity:.32}

.sh{height:var(--head);flex:none;display:flex;align-items:center;padding:0 var(--pad);gap:14px;border-bottom:1px solid var(--line)}
.sh .ti{font:600 var(--f-ti)/1 Inter,sans-serif}
.sh .cr{font:400 var(--f-s)/1 Inter,sans-serif;color:var(--dim)}
.sh .clock{margin-left:auto;font:400 20px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--dim)}
.content{flex:1;min-height:0;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}
.k{font:600 var(--f-lb)/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;min-width:0}
.spin{width:19px;height:19px;border-radius:50%;border:2px solid rgba(240,168,53,.28);border-top-color:var(--acc);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bl{50%{opacity:.25}}

/* banner riconnessione */
.banner{flex:none;display:flex;align-items:center;gap:12px;padding:14px var(--pad);background:#251d0e;border-bottom:1px solid #4a3c1c;color:#f0c987;font:500 var(--f-s)/1.4 Inter,sans-serif}

/* accessi verticale */
.camtop{flex:none;position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#05070a;aspect-ratio:16/9}
.camtop svg.scene{position:absolute;inset:0;width:100%;height:100%}
.camtop .ov{position:absolute;left:13px;top:12px;display:flex;align-items:center;gap:9px;font:600 12px/1 Inter,sans-serif;color:#fff}
.camtop .live{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px}
.camtop .live i{width:7px;height:7px;border-radius:50%;background:#e2664f;animation:bl 1.6s infinite}
.camtop .ts{position:absolute;right:13px;bottom:11px;font:500 12px/1 Inter,sans-serif;color:#e6eaf0;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px}
.camdead{flex:none;aspect-ratio:16/9;border:1px solid var(--line);border-radius:var(--r);background:#0a0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.camdead svg{width:40px;height:40px;color:#3f4a5a}
.camdead .t{font:500 var(--f-nm)/1 Inter,sans-serif;color:var(--dim)}
.camdead .s{font:400 13px/1 Inter,sans-serif;color:#5d6878}
.thumbs{flex:none;display:flex;gap:10px}
.th{flex:1;border:1px solid var(--line);border-radius:11px;overflow:hidden;position:relative;background:#0a0e14;aspect-ratio:16/9}
.th.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.th svg.scene{position:absolute;inset:0;width:100%;height:100%}
.th span{position:absolute;left:8px;bottom:6px;font:500 11.5px/1 Inter,sans-serif;color:#dfe5ee;text-shadow:0 1px 3px #000}
.skel{position:absolute;inset:0;background:linear-gradient(90deg,#12171e 20%,#1b222c 40%,#12171e 60%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{0%{background-position:120% 0}100%{background-position:-20% 0}}
.arow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);flex:1;display:flex;align-items:center;gap:14px;padding:0 16px;min-height:0}
.arow>svg{width:23px;height:23px;color:var(--dim);flex:none}
.arow .nm{font:500 var(--f-nm)/1.15 Inter,sans-serif}
.arow .st{font:400 12.5px/1.3 Inter,sans-serif;color:var(--dim);margin-top:5px}
.arow.active{border-color:#4a3c1c;background:#181c1a}
.arow.luce{border-color:#3a2f1a}
.btn{margin-left:auto;flex:none;background:var(--acc);color:var(--ink);border-radius:11px;padding:15px 22px;font:600 16px/1 Inter,sans-serif;text-align:center;min-width:132px;display:flex;align-items:center;justify-content:center;gap:9px}
.btn small{display:block;font:500 10px/1 Inter,sans-serif;color:rgba(0,0,0,.55);margin-top:5px}
.btn.wait{background:#2a2313;color:#f0c987;border:1px solid #4a3c1c}
.btn.done{background:#16301f;color:#7ddba6;border:1px solid #2c5a3d}
.btn.fail{background:#2e1a17;color:#f09287;border:1px solid #5a2f28}
.btn svg{width:18px;height:18px}
.btn .spin{width:16px;height:16px}
.swbig{margin-left:auto;width:58px;height:32px;border-radius:20px;background:var(--acc);position:relative;flex:none}
.swbig i{position:absolute;top:3px;left:29px;width:26px;height:26px;border-radius:50%;background:var(--ink)}

/* avviso */
.toast{flex:none;border-radius:14px;display:flex;align-items:flex-start;gap:14px;padding:16px 18px;font:500 var(--f-nm)/1.35 Inter,sans-serif}
.toast svg{width:23px;height:23px;flex:none;margin-top:1px}
.toast .s{font:400 13px/1.4 Inter,sans-serif;opacity:.75;margin-top:5px}
.toast .act{margin-left:auto;border:1px solid currentColor;border-radius:10px;padding:13px 19px;font:600 15px/1 Inter,sans-serif;flex:none}
.toast.ok{background:#13251c;border:1px solid #2c5a3d;color:#a9e3c3}
.toast.ok svg{color:#4fc39a}
.toast.err{background:#271815;border:1px solid #5a2f28;color:#f3b5ac}
.toast.err svg{color:var(--warn)}

/* modale */
.veil{position:absolute;inset:0;background:rgba(5,7,10,.76);display:flex;align-items:center;justify-content:center;padding:24px}
.modal{width:100%;background:var(--card);border:1px solid #2b323d;border-radius:20px;padding:28px 26px 24px;text-align:center}
.modal .ic{width:62px;height:62px;border-radius:50%;background:#221c0e;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.modal .ic svg{width:31px;height:31px;color:var(--acc)}
.modal .t{font:600 25px/1.25 Inter,sans-serif}
.modal .s{font:400 14.5px/1.5 Inter,sans-serif;color:var(--dim);margin-top:11px}
.modal .btns{display:flex;gap:12px;margin-top:24px}
.modal .b{flex:1;border-radius:13px;padding:19px 0;font:600 17px/1 Inter,sans-serif}
.modal .b.no{border:1px solid var(--line);color:var(--txt);background:var(--card2)}
.modal .b.yes{background:var(--acc);color:var(--ink)}
.modal .cdw{font:400 13px/1 Inter,sans-serif;color:#5d6878;margin-top:15px}

/* PIN verticale */
.pinwrap{width:100%;background:var(--card);border:1px solid #2b323d;border-radius:20px;padding:26px 24px}
.pinwrap .ic{width:52px;height:52px;border-radius:50%;background:#221c0e;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.pinwrap .ic svg{width:26px;height:26px;color:var(--acc)}
.pinwrap .t{font:600 23px/1.3 Inter,sans-serif;text-align:center}
.pinwrap .s{font:400 14px/1.5 Inter,sans-serif;color:var(--dim);margin-top:9px;text-align:center}
.pindots{display:flex;gap:15px;margin:22px auto 6px;justify-content:center}
.pindots i{width:19px;height:19px;border-radius:50%;border:2px solid #3a434f}
.pindots i.f{background:var(--acc);border-color:var(--acc)}
.pinwrap .att{font:400 12.5px/1 Inter,sans-serif;color:#6f7b8c;text-align:center;margin-bottom:20px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad .p{height:76px;background:var(--card2);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font:500 27px/1 Inter,sans-serif}
.pad .p.f{font-size:14px;color:var(--dim)}

/* avvio */
.boot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 var(--pad)}
.boot .logo{width:82px;height:82px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.boot .logo svg{width:38px;height:38px;color:var(--acc)}
.boot .nm{font:300 34px/1 Inter,sans-serif}
.boot .vr{font:400 13.5px/1 Inter,sans-serif;color:#5d6878;margin-top:11px}
.boot .list{width:100%;margin-top:34px;display:flex;flex-direction:column;gap:2px}
.bl{display:flex;align-items:center;gap:13px;padding:13px 4px;font:400 var(--f-nm)/1 Inter,sans-serif;color:var(--dim)}
.bl .ic{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.bl .ic svg{width:19px;height:19px}
.bl.done{color:#9fb0a8}.bl.done .ic svg{color:var(--ok)}
.bl.now{color:var(--txt)}
.bl .rs{margin-left:auto;font:400 13px/1 Inter,sans-serif;color:#5d6878;font-variant-numeric:tabular-nums}
.bl.wait{opacity:.42}
.bl .dw{width:8px;height:8px;border-radius:50%;background:#3f4a5a}
.boot .pb{width:100%;height:6px;border-radius:4px;background:var(--off);margin-top:26px;overflow:hidden;position:relative}
.boot .pb i{position:absolute;inset:0 auto 0 0;width:64%;background:var(--acc);border-radius:4px}
.boot .hint{font:400 13px/1.45 Inter,sans-serif;color:#5d6878;margin-top:18px;text-align:center}

/* HA giù */
.offwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 26px}
.offwrap .ic{width:86px;height:86px;border-radius:50%;background:#2a1a16;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.offwrap .ic svg{width:41px;height:41px;color:var(--warn)}
.offwrap .t{font:600 28px/1.3 Inter,sans-serif}
.offwrap .s{font:400 15.5px/1.6 Inter,sans-serif;color:var(--dim);margin-top:14px}
.offwrap .btns{display:flex;flex-direction:column;gap:12px;margin-top:26px;width:100%}
.offwrap .b{border-radius:13px;padding:18px 0;font:600 16px/1 Inter,sans-serif;background:var(--acc);color:var(--ink)}
.offwrap .b.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.offtop{flex:none;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);color:var(--dim);font:400 13.5px/1 Inter,sans-serif}
.offtop .cl{font:500 22px/1 Inter,sans-serif;color:var(--txt);font-variant-numeric:tabular-nums}

/* standby */
.sb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);opacity:.62}
.sb .t{font:200 150px/1 Inter,sans-serif;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.sb .d{font:400 20px/1.4 Inter,sans-serif;color:var(--dim);margin-top:14px}
.sb .row{display:flex;flex-direction:column;gap:20px;margin-top:44px}
.sb .row .i{display:flex;align-items:center;gap:13px;font:400 17px/1 Inter,sans-serif;color:#aab3c1}
.sb .row .i svg{width:21px;height:21px;color:#6f7b8c}
.sb .row .i b{color:var(--txt);font-weight:500}

/* impostazioni e diagnostica */
.srow{display:flex;align-items:center;gap:15px;padding:16px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:none;padding-top:4px}
.srow .nm{font:500 var(--f-nm)/1.2 Inter,sans-serif}
.srow .st{font:400 13px/1.35 Inter,sans-serif;color:var(--dim);margin-top:5px}
.srow .act{margin-left:auto;flex:none;border:1px solid var(--line);border-radius:10px;padding:13px 17px;font:500 14.5px/1 Inter,sans-serif;color:var(--txt);background:var(--card2)}
.srow .act.acc{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600}
.srow .val{margin-left:auto;font:500 var(--f-nm)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.sw2{margin-left:auto;width:58px;height:32px;border-radius:20px;background:var(--off);position:relative;flex:none}
.sw2 i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#6b7686}
.sw2.on{background:var(--acc)}.sw2.on i{left:29px;background:var(--ink)}
.slider{flex:1;max-width:220px;margin-left:auto;height:11px;border-radius:6px;background:var(--off);position:relative}
.slider i{position:absolute;inset:0 auto 0 0;width:62%;background:var(--acc);border-radius:6px}
.slider u{position:absolute;top:50%;left:62%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.mcell{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.mcell .kk{font:400 11.5px/1 Inter,sans-serif;color:var(--dim)}
.mcell .vv{font:500 var(--f-nm)/1 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:8px}
.mcell.warn{border-color:#4a3c1c;background:#221c0e}
.mcell.warn .vv{color:var(--acc)}
.logf{display:flex;gap:8px;flex:none;margin-top:2px}
.logf .lf{flex:1;height:44px;border:1px solid var(--line);background:var(--card2);border-radius:10px;display:flex;align-items:center;justify-content:center;font:500 13px/1 Inter,sans-serif;color:var(--dim)}
.logf .lf.sel{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600}
.loglist{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px;margin-top:10px}
.lg{display:flex;gap:11px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.04);font:400 12.5px/1.35 "JetBrains Mono",monospace}
.lg .tm{color:#5d6878;flex:none}
.lg .lv{flex:none;font-weight:500;width:52px}
.lg.err .lv{color:var(--warn)}
.lg.avv .lv{color:var(--acc)}
.lg.inf .lv{color:#5d6878}
.lg .ms{color:#b6bfcd;min-width:0}

/* primo avvio e tastiera */
.first{flex:1;display:flex;flex-direction:column;padding:var(--pad)}
.first .top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.first .top .t{font:600 27px/1 Inter,sans-serif}
.steps{margin-left:auto;display:flex;gap:9px}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--off)}
.steps i.on{background:var(--acc)}
.wifis{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 6px;display:flex;flex-direction:column;overflow:hidden}
.wf{display:flex;align-items:center;gap:14px;padding:0 15px;flex:1;border-radius:11px}
.wf svg{width:21px;height:21px;color:var(--dim);flex:none}
.wf .nm{font:500 var(--f-nm)/1 Inter,sans-serif}
.wf .lock{margin-left:auto;font:400 12.5px/1 Inter,sans-serif;color:var(--dim)}
.wf.sel{background:#221c0e;box-shadow:inset 0 0 0 1px #4a3c1c}
.wf.sel svg{color:var(--acc)}
.qrsm{flex:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:16px;margin-top:14px}
.qrsm .q{width:130px;height:130px;background:#fff;border-radius:10px;padding:8px;flex:none}
.qrsm .tx{font:400 13.5px/1.55 Inter,sans-serif;color:var(--dim)}
.qrsm .tx b{display:block;color:var(--txt);font:500 15px/1.3 Inter,sans-serif;margin-bottom:6px}
.kb{flex:1;display:flex;flex-direction:column;padding:var(--pad)}
.kbtop .t{font:600 21px/1 Inter,sans-serif}
.kbtop .s{font:400 13.5px/1 Inter,sans-serif;color:var(--dim);margin-top:8px}
.kbfield{flex:none;height:78px;background:var(--card);border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;padding:0 18px;gap:14px;margin:14px 0 12px}
.kbfield .vv{font:500 24px/1 Inter,sans-serif;letter-spacing:.2em}
.kbfield .car{width:2px;height:28px;background:var(--acc);animation:bl2 1.1s infinite}
@keyframes bl2{50%{opacity:0}}
.kbfield .eye{margin-left:auto;font:500 13px/1 Inter,sans-serif;color:var(--dim);border:1px solid var(--line);border-radius:9px;padding:11px 13px}
.kbrows{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.kbrow{flex:1;max-height:96px;display:flex;gap:7px}
.key{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font:500 21px/1 Inter,sans-serif;color:var(--txt)}
.key.wide{flex:1.5;font-size:13px;color:var(--dim)}
.key.ok{flex:2.2;background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600;font-size:16px}
.key.sp{flex:4}

/* wifi privata */
.qcard{flex:none;background:#fff;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.qcard .q{width:100%;max-width:380px;aspect-ratio:1}
.qcard .cap{font:600 13.5px/1.3 Inter,sans-serif;color:#171b20;margin-top:12px;text-align:center}
.wbox .v{font:600 32px/1.15 Inter,sans-serif;margin-top:11px;word-break:break-all}
.wbox .v.mono{font-family:"JetBrains Mono",monospace;font-size:26px;font-weight:500}
.wbox .hd{display:flex;align-items:center;gap:12px}
.wbox .hd .act{margin-left:auto;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:500 13px/1 Inter,sans-serif;color:var(--txt);background:var(--card2)}
.wnote{flex:none;border-radius:var(--r);padding:14px 16px;display:flex;gap:11px;font:400 13px/1.55 Inter,sans-serif;background:#251d0e;border:1px solid #4a3c1c;color:#f0c987}
.wnote svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--acc)}
.cd{margin-left:auto;font:500 14px/1 Inter,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">

<script>
function scene(id){return `
<svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a4d"/><stop offset="1" stop-color="#151d27"/></linearGradient>
  <radialGradient id="lm${id}" cx="50%" cy="50%"><stop offset="0" stop-color="rgba(255,214,150,.5)"/><stop offset="1" stop-color="rgba(255,214,150,0)"/></radialGradient></defs>
  <rect width="640" height="360" fill="url(#sk${id})"/>
  <rect y="150" width="640" height="210" fill="#171d25"/>
  <path d="M0 360 L250 168 L390 168 L640 360 Z" fill="#20272f"/>
  <path d="M60 360 L268 176 L372 176 L580 360 Z" fill="#262e37"/>
  <rect x="0" y="120" width="150" height="130" fill="#1b222b"/><rect x="490" y="120" width="150" height="130" fill="#1b222b"/>
  <circle cx="150" cy="128" r="70" fill="url(#lm${id})"/>
  <g stroke="#39434f" stroke-width="5">
    <path d="M150 150v100M186 150v100M222 150v100M258 152v96M294 154v92M148 160h150M148 236h150"/>
    <path d="M350 154v92M386 152v96M422 150v100M458 150v100M494 150v100M346 160h150M346 236h150"/></g>
  <rect x="300" y="140" width="44" height="120" fill="#2c343d"/></svg>`}
function qr(seed){
  let s=seed,N=25,m=[];
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
  for(let y=0;y<N;y++){m[y]=[];for(let x=0;x<N;x++)m[y][x]=rnd()>0.52?1:0}
  const fp=(ox,oy)=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++){
    const b=(x===0||x===6||y===0||y===6)||(x>1&&x<5&&y>1&&y<5);m[oy+y][ox+x]=b?1:0}
    for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const px=ox+x,py=oy+y;
      if(px>=0&&py>=0&&px<N&&py<N&&(x<0||x>6||y<0||y>6))m[py][px]=0}};
  fp(0,0);fp(N-7,0);fp(0,N-7);
  for(let i=8;i<N-8;i++){m[6][i]=i%2?0:1;m[i][6]=i%2?0:1}
  let r=`<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" style="width:100%;height:100%"><rect width="${N}" height="${N}" fill="#fff"/><g fill="#0d1014">`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return r+'</g></svg>';
}
const NAV=[['luci','Luci','i-bulb'],['clima','Clima','i-thermo'],['pv','Energia','i-sun'],
           ['cam','Camere','i-cam'],['acc','Accessi','i-gate'],['ag','Agenda','i-cal'],['wifi','Wi-Fi','i-wifi']];
const bar=(sel,dis)=>`<nav class="navbar">
  <div class="nb home"><svg><use href="#i-home"/></svg><span>HOME</span></div>
  ${NAV.map(([id,lb,ic])=>`<div class="nb ${id===sel?'sel':''} ${dis&&id!==sel?'dis':''}"><svg><use href="#${ic}"/></svg><span>${lb}</span></div>`).join('')}
</nav>`;
const sh=(ti,cr,right)=>`<div class="sh"><div class="ti">${ti}</div><div class="cr">${cr}</div>${right||'<div class="clock">18:42</div>'}</div>`;
const wrap=(r,corpo,sel,dis,extra)=>`<section class="screen" data-r="${r}">${corpo}${bar(sel,dis)}${extra||''}</section>`;

/* ---- accessi con stato del comando ---- */
function accessi(r, stato, extra, toast){
  const B={idle:'<div class="btn">Apri</div>',
   wait:'<div class="btn wait"><span class="spin"></span>Invio…</div>',
   done:'<div class="btn done"><svg><use href="#i-check"/></svg>Inviato</div>',
   fail:'<div class="btn fail"><svg><use href="#i-x"/></svg>Non riuscito</div>'};
  const cr={idle:'4 telecamere in diretta',wait:'comando in corso',
            done:'impulso inviato alle 18:42:11',fail:'nessuna risposta da Home Assistant'};
  return wrap(r, sh('Accessi',cr[stato])+`
<div class="content">
  <div class="camtop">${scene('m'+stato)}
    <div class="ov"><span class="live"><i></i>DIRETTA</span><span>Cancello esterno</span></div>
    <div class="ts">18:42:11</div></div>
  <div class="thumbs">
    <div class="th">${scene('u1'+stato)}<span>Pedonale</span></div>
    <div class="th sel">${scene('u2'+stato)}<span>Carraio</span></div>
    <div class="th">${scene('u3'+stato)}<span>Garage</span></div>
    <div class="th">${scene('u4'+stato)}<span>Portico</span></div>
  </div>
  <div class="arow"><svg><use href="#i-fence"/></svg>
    <div><div class="nm">Cancello pedonale</div><div class="st">ultimo impulso 17:58</div></div>
    <div class="btn">Apri</div></div>
  <div class="arow ${stato!=='idle'?'active':''}"><svg><use href="#i-gate"/></svg>
    <div><div class="nm">Cancello esterno</div><div class="st">${stato==='fail'?'riprova o usa il telecomando':'conferma richiesta'}</div></div>
    ${B[stato]}</div>
  <div class="arow"><svg><use href="#i-home"/></svg>
    <div><div class="nm">Porta del garage</div><div class="st">chiusa</div></div>
    <div class="btn">Apri</div></div>
  <div class="arow luce"><svg><use href="#i-bulb"/></svg>
    <div><div class="nm">Luci giardino</div><div class="st" style="color:#f0a835">accese</div></div>
    <div class="swbig"><i></i></div></div>
  ${toast||''}
</div>`,'acc',false,extra);
}

      <div style="height:9px;border-radius:6px;background:#232b35;position:relative;overflow:hidden">
        <i style="position:absolute;left:0;top:0;bottom:0;width:${p||0}%;background:#f0a835;border-radius:6px"></i></div>
    </div>`).join('')}

const diag=(r)=>wrap(r, sh('Sistema','registro e contatori')+`

      <div class="mcell warn"><div class="kk">Heap minimo</div><div class="vv">39,8 KB</div></div>

      <div class="mcell"><div class="kk">Wi-Fi</div><div class="vv">−48 dBm</div></div>
    </div>
  </div>
  <div class="logf"><div class="lf sel">Tutti</div><div class="lf">Errori</div><div class="lf">Avvisi</div><div class="lf">Info</div></div>
  <div class="loglist">
    <div class="lg err"><span class="tm">18:39:02</span><span class="lv">ERRORE</span><span class="ms">ha: websocket chiuso dal server</span></div>
    <div class="lg avv"><span class="tm">18:39:17</span><span class="lv">AVVISO</span><span class="ms">ha: riconnessione, tentativo 1</span></div>
    <div class="lg inf"><span class="tm">18:39:19</span><span class="lv">INFO</span><span class="ms">ha: autenticato, 47 entità</span></div>
    <div class="lg avv"><span class="tm">18:40:55</span><span class="lv">AVVISO</span><span class="ms">cam pedonale: timeout, 1 di 3</span></div>
    <div class="lg inf"><span class="tm">18:41:02</span><span class="lv">INFO</span><span class="ms">cam pedonale: rientrata</span></div>
    <div class="lg inf"><span class="tm">18:42:11</span><span class="lv">INFO</span><span class="ms">cmd switch.cancello_carraio ok 128 ms</span></div>
    <div class="lg err"><span class="tm">18:42:40</span><span class="lv">ERRORE</span><span class="ms">heap sotto soglia: 39,8 KB</span></div>
  </div>
  <div style="flex:none;display:flex;gap:10px">
    <div class="act" style="flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:15px;font:500 14.5px/1 Inter,sans-serif;background:var(--card2)">Mostra come QR</div>
    <div class="act" style="flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:15px;font:500 14.5px/1 Inter,sans-serif;background:var(--card2)">Svuota registro</div>
  </div>
</div>`,'');

/* ---- primo avvio ---- */
const first=(r)=>`<section class="screen" data-r="${r}"><div class="first">
  <div class="top"><div class="t">Scegli la rete</div><div class="steps"><i class="on"></i><i></i><i></i></div></div>
  <div class="wifis">
    ${[['CasaWiFi','protetta',1],['CasaWiFi_5G','protetta',0],['CasaOspiti','protetta',0],
       ['FRITZ!Box 7530','protetta',0],['Vicini-2.4','protetta',0],['Altra rete…','manuale',0]]
      .map(([n,l,s])=>`<div class="wf ${s?'sel':''}"><svg><use href="#i-wifi"/></svg><span class="nm">${n}</span><span class="lock">${l}</span></div>`).join('')}
  </div>
  <div class="qrsm"><div class="q">${qr(11)}</div>
    <div class="tx"><b>Oppure dal telefono</b>Inquadra il codice: la configurazione prosegue lì, con la tastiera vera.</div></div>
</div></section>`;

/* ---- tastiera ---- */
const R1='qwertyuiop'.split(''),R2='asdfghjkl'.split(''),R3='zxcvbnm'.split('');
const kb=(r)=>`<section class="screen" data-r="${r}"><div class="kb">
  <div class="kbtop"><div class="t">Password della rete</div><div class="s">passo 1 di 3 · CasaWiFi</div></div>
  <div class="kbfield"><span class="vv">••••••••••</span><span class="car"></span><span class="eye">Mostra</span></div>
  <div class="kbrows">
    <div class="kbrow">${R1.map(c=>`<div class="key">${c}</div>`).join('')}</div>
    <div class="kbrow">${R2.map(c=>`<div class="key">${c}</div>`).join('')}</div>
    <div class="kbrow"><div class="key wide">MAIUSC</div>${R3.map(c=>`<div class="key">${c}</div>`).join('')}<div class="key wide">CANC</div></div>
    <div class="kbrow"><div class="key wide">123</div><div class="key sp">spazio</div><div class="key ok">Connetti</div></div>
  </div>
</div></section>`;

/* ---- PIN ---- */
const pin=(r)=>wrap(r, sh('Wi-Fi','rete privata')+
`<div class="content" style="justify-content:center">
  <div class="pinwrap">
    <div class="ic"><svg><use href="#i-lock"/></svg></div>
    <div class="t">Rete privata</div>
    <div class="s">Inserisci il PIN per mostrare il codice di collegamento.</div>
    <div class="pindots"><i class="f"></i><i class="f"></i><i></i><i></i></div>
    <div class="att">3 tentativi rimasti prima del blocco di 5 minuti</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="p">${n}</div>`).join('')}
      <div class="p f">Annulla</div><div class="p">0</div><div class="p f">Canc</div></div>
  </div>
</div>`,'wifi');

/* ---- rete privata sbloccata ---- */
const priv=(r)=>wrap(r, sh('Wi-Fi privata','visibile temporaneamente','<div class="cd">si nasconde tra 0:42</div>')+
`<div class="content">
  <div class="qcard"><div class="q">${qr(19)}</div><div class="cap">Inquadra con la fotocamera del telefono</div></div>
  <div class="card wbox"><div class="k">Nome rete</div><div class="v">CasaWiFi</div></div>
  <div class="card wbox"><div class="hd"><div class="k">Password</div><div class="act">Mostra</div></div>
    <div class="v mono" style="color:#8a95a6">•••••••••••••</div></div>
  <div class="wnote"><svg><use href="#i-warn"/></svg>
    Questa è la rete di casa: chi si collega raggiunge telecamere, Home Assistant e tutti i dispositivi.</div>
</div>`,'wifi');

const S={
 inv:(r)=>accessi(r,'wait'), ok:(r)=>accessi(r,'done',null,TOK), ko:(r)=>accessi(r,'fail',null,TKO),
 conf:(r)=>accessi(r,'idle',MODAL), avvio, ric, haoff, camoff, sb, set, diag, first, kb, pin, priv};

const CAP={
 inv:`<h3>Comando in corso</h3>Il riscontro sta nel pulsante toccato: rotellina e "Invio…", riga evidenziata. In verticale le righe dei comandi sono <b>larghe quanto lo schermo</b>, quindi il pulsante è enorme e il testo accanto sta comodo.`,
 ok:`<h3>Comando riuscito</h3>Pulsante verde per tre secondi. L'avviso non galleggia sopra il contenuto ma <b>si aggiunge in fondo alla colonna</b>: in verticale c'è spazio, e un avviso che copre i comandi mentre stai aprendo un cancello è la cosa da evitare.`,
 ko:`<h3>Comando fallito</h3>Pulsante rosso e avviso persistente con "Riprova" a portata di pollice. Resta finché non lo tocchi: chi è davanti al cancello deve accorgersene.`,
 conf:`<h3>Conferma di apertura</h3>Riquadro modale a tutta larghezza meno i margini. La telecamera resta visibile dietro il velo: vedi chi stai facendo entrare mentre confermi.`,
 avvio:`<h3>Avvio</h3>Elenco dei passi con esito e tempi, centrato verticalmente. Sul pannello grande c'è un passo in più per il co-processore C6, che può fallire per conto suo. In fondo la promessa: se un pezzo non risponde, si parte comunque in sola lettura.`,
 ric:`<h3>Riconnessione</h3>Fascia ambra in testa, sopra la testata di sezione. I valori restano visibili al 45% — sono veri, solo vecchi — e le voci della barra in basso si attenuano, tranne quella dove sei.`,
 haoff:`<h3>Home Assistant irraggiungibile</h3>Schermata piena senza barra di navigazione: non c'è nulla da navigare. In verticale i due pulsanti si impilano invece di affiancarsi, e diventano larghi quanto lo schermo. In alto restano rete e orologio, perché l'ora viene da NTP.`,
 camoff:`<h3>Telecamera offline</h3>Il riquadro morto mantiene il <b>rapporto 16:9</b> invece di collassare, così il layout non salta quando la telecamera rientra. La miniatura in attesa usa l'animazione di caricamento; i comandi restano attivi.`,
 sb:`<h3>Standby</h3>Orologio da 150 px e le quattro informazioni <b>impilate</b> invece che in riga: in verticale si leggono meglio una sotto l'altra, e da lontano si scandiscono con lo sguardo.`,
 set:`<h3>Impostazioni</h3>Il menu laterale sparisce: in verticale diventa <b>un elenco unico con intestazioni</b>, che si scorre. Più semplice e più adatto al formato. C'è anche la voce che apre il registro.`,
 diag:`<h3>Sistema e registro</h3>Contatori in una griglia 2×2 in alto, con i valori fuori soglia in ambra — qui l'heap minimo. Sotto, il registro filtrabile per livello, in carattere monospaziato. In fondo "Mostra come QR": inquadri e continui a leggere il registro dal telefono.`,
 first:`<h3>Primo avvio</h3>L'elenco delle reti si prende tutta l'altezza disponibile, con righe alte e comode. Il codice QR passa da riquadro laterale a <b>fascia orizzontale in fondo</b>.`,
 kb:`<h3>Tastiera</h3>È il punto dolente della verticale: dieci tasti su 800 px fanno tasti da 72 px di larghezza, contro i 116 dell'orizzontale. Restano alti, quindi usabili, ma è stretto: un motivo in più per configurare dal telefono col QR.`,
 pin:`<h3>PIN</h3>In verticale il tastierino sta <b>sotto</b> i pallini invece che di fianco: tasti da 76 px di altezza e un pollice che non deve attraversare lo schermo.`,
 priv:`<h3>Rete privata</h3>Password nascosta anche dopo il PIN, conto alla rovescia in testata, avviso ambra su cosa raggiunge chi si collega. Il QR resta grande.`
};

let prof='p4', scr='inv';
const DIM={p4:[800,1280]};
function render(){
  const [w,h]=DIM[prof];
  const st=document.getElementById('stage');
  st.style.width=w+'px'; st.style.height=h+'px';
  st.innerHTML=S[scr](prof);
  document.getElementById('cap').innerHTML=CAP[scr];
  document.querySelectorAll('#gr button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===prof)));
  document.querySelectorAll('#g1 button,#g2 button,#g3 button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===scr)));
  fit();
}
function fit(){
  const [w,h]=DIM[prof];
  const frame=document.getElementById('frame');
  const disp=Math.min(760, window.innerHeight-160);
  const s=Math.min(1, disp/h);
  document.getElementById('stage').style.transform='scale('+s+')';
  frame.style.width=(w*s+24)+'px'; frame.style.height=(h*s+24)+'px';
}
document.querySelectorAll('#gr button').forEach(b=>b.onclick=()=>{prof=b.dataset.p;render()});
document.querySelectorAll('#g1 button,#g2 button,#g3 button').forEach(b=>b.onclick=()=>{scr=b.dataset.s;render()});
addEventListener('resize',fit);
render();
</script>
</body>
</html>
