<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foyer Panel · pannelli in verticale · 800×1280</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#15171b;color:#d8dce3;font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1400px;margin:0 auto;padding:18px 14px 60px}
h1.tt{font-size:15px;font-weight:600;margin:0 0 2px;color:#e6e9ee}
p.sub{font-size:12.5px;color:#8b929e;margin:0 0 14px}
.grp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.grp .lb{font:500 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6d747f;margin-right:4px}
.grp button{appearance:none;border:1px solid #2c3038;background:#1c1f25;color:#aeb5c0;font:500 12.5px/1 Inter,sans-serif;padding:9px 12px;border-radius:8px;cursor:pointer}
.grp button:hover{border-color:#3d434e;color:#e6e9ee}
.grp button[aria-pressed="true"]{background:#e6e9ee;color:#15171b;border-color:#e6e9ee}
.wrap{display:flex;gap:26px;align-items:flex-start}
.frame{position:relative;background:#000;border:12px solid #24272d;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.5);overflow:hidden;flex:none}
.stage{transform-origin:top left;position:relative;overflow:hidden}
.caption{font-size:12.5px;color:#9aa1ad;line-height:1.65;flex:1;min-width:260px;padding-top:6px}
.caption b{color:#e6e9ee;font-weight:600}
.caption h3{font:600 13px/1.4 Inter,sans-serif;color:#e6e9ee;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;
  --bg:#0d1014;--card:#151a21;--card2:#11161c;--line:#1e242d;--txt:#e8ecf2;--dim:#8a95a6;
  --acc:#f0a835;--ok:#4fc39a;--cool:#57b6e0;--warn:#e2664f;--ink:#0d1014;--off:#232b35;
  /* profilo p4-800x1280 */
  --r:16px;--pad:18px;--gap:14px;--bar:112px;--head:72px;--homehead:116px;
  --f-ti:26px;--f-nm:17px;--f-val:38px;--f-s:14px;--f-lb:12px;--f-clock:64px;
  background:var(--bg);color:var(--txt)}

/* ---------- barra di navigazione in basso ---------- */
.navbar{height:var(--bar);flex:none;display:flex;background:var(--card2);border-top:1px solid var(--line)}
.nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#6f7b8c;border-right:1px solid rgba(255,255,255,.03)}
.nb:last-child{border-right:none}
.nb svg{width:23px;height:23px;flex:none}
.nb span{font:500 10.5px/1 Inter,sans-serif;white-space:nowrap}
.nb.home{color:var(--acc);background:var(--card)}
.nb.sel{background:#221c0e;color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}

/* ---------- testate ---------- */
.hh{height:var(--homehead);flex:none;display:flex;align-items:center;gap:16px;padding:0 var(--pad);border-bottom:1px solid var(--line)}
.hh .t{font:600 var(--f-clock)/1 Inter,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hh .d{font:400 var(--f-s)/1.35 Inter,sans-serif;color:var(--dim)}
.hh .wx{margin-left:auto;display:flex;align-items:center;gap:11px}
.hh .wx svg{width:26px;height:26px;color:var(--acc)}
.hh .wx .deg{font:500 30px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.hh .wx .meta{font:400 12px/1.4 Inter,sans-serif;color:var(--dim)}
.hh .gear{width:46px;height:46px;flex:none;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--dim);background:var(--card2)}
.hh .gear svg{width:20px;height:20px}
.sh{height:var(--head);flex:none;display:flex;align-items:center;padding:0 var(--pad);gap:14px;border-bottom:1px solid var(--line)}
.sh .ti{font:600 var(--f-ti)/1 Inter,sans-serif}
.sh .cr{font:400 var(--f-s)/1 Inter,sans-serif;color:var(--dim)}
.sh .clock{margin-left:auto;font:400 20px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--dim)}
.sh .pager{margin-left:auto;display:flex;align-items:center;gap:8px}
.sh .ar{width:46px;height:42px;border:1px solid var(--line);background:var(--card2);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.sh .ar svg{width:19px;height:19px}
.sh .ar.off{opacity:.3}
.sh .n{font:500 13px/1 Inter,sans-serif;color:var(--dim);min-width:36px;text-align:center}

.content{flex:1;min-height:0;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}
.k{font:600 var(--f-lb)/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;min-width:0}
.due{display:flex;gap:var(--gap);min-height:0}
.due>*{flex:1;min-width:0}

/* ---------- home ---------- */
.en-top{display:flex;align-items:flex-end;gap:12px;margin-top:12px}
.en-top .v{font:600 52px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--ok)}
.en-top .u{font:500 14px/1.3 Inter,sans-serif;color:var(--dim);padding-bottom:6px}
.en-grid{display:flex;gap:10px;margin-top:14px}
.en-cell{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.en-cell .kk{font:400 11.5px/1 Inter,sans-serif;color:var(--dim)}
.en-cell .vv{font:500 var(--f-nm)/1 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:8px}
.bar2{height:9px;border-radius:6px;background:var(--off);overflow:hidden;position:relative;margin-top:12px}
.bar2 i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ok)}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.prow{display:flex;align-items:center;gap:12px;padding:6px 0}
.av{width:38px;height:38px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 16px/1 Inter,sans-serif;background:#232b35;color:#8f9aa9}
.av.in{background:var(--acc);color:var(--ink)}
.prow .nm{font:500 var(--f-nm)/1 Inter,sans-serif}
.prow .st{font:400 12px/1.3 Inter,sans-serif;color:var(--dim);margin-top:4px}
.prow.out .nm{color:var(--dim)}
.op-big{display:flex;align-items:baseline;gap:9px;margin-top:12px}
.op-big .v{font:600 44px/1 Inter,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.op-big .u{font:500 13px/1.3 Inter,sans-serif;color:var(--dim)}
.op-l{margin-top:10px;display:flex;flex-direction:column;gap:7px;font:400 13px/1.35 Inter,sans-serif;color:#b6bfcd}
.op-f{margin-top:auto;padding-top:11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.op-f .f{display:flex;align-items:center;gap:9px;font:400 12.5px/1 Inter,sans-serif;color:var(--dim)}
.op-f .f svg{width:15px;height:15px;color:#5d6878}
.op-f .f b{color:var(--txt);font-weight:500}
.ag-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev .tm{font:600 13.5px/1.25 Inter,sans-serif;color:var(--acc);width:46px;flex:none;font-variant-numeric:tabular-nums}
.ev .tx{font:400 var(--f-nm)/1.3 Inter,sans-serif}
.ev .who{font:400 12px/1.3 Inter,sans-serif;color:var(--dim);margin-top:3px}
.ev.past{opacity:.45}
.strip{flex:none;display:flex;gap:12px}
.sth{aspect-ratio:16/9}
.sth{flex:1;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0e14}
.sth svg.scene{position:absolute;inset:0;width:100%;height:100%}
.sth .nm{position:absolute;left:10px;bottom:8px;font:500 12px/1 Inter,sans-serif;color:#fff;text-shadow:0 1px 4px #000}
.sth .lv{position:absolute;left:10px;top:8px;display:flex;align-items:center;gap:5px;font:600 10px/1 Inter,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:4px 7px;border-radius:5px}
.sth .lv i{width:5px;height:5px;border-radius:50%;background:#e2664f;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}

/* ---------- griglie 2 colonne ---------- */
.g2{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);min-height:0}
.lc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.lc .top{display:flex;align-items:center;gap:10px}
.lc .top svg{width:21px;height:21px;color:var(--dim)}
.lc .nm{font:500 var(--f-nm)/1 Inter,sans-serif}
.lc .sw{margin-left:auto;width:56px;height:31px;border-radius:20px;background:var(--off);position:relative}
.lc .sw i{position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#6b7686}
.lc.on .sw{background:var(--acc)}.lc.on .sw i{left:28px;background:var(--ink)}
.lc .pct{font:600 var(--f-val)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.lc .pct span{font-size:16px;color:var(--dim)}
.lc .track{height:9px;border-radius:6px;background:var(--off);position:relative;overflow:hidden}
.lc .track i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:6px}
.lc.off .pct,.lc.off .nm{color:var(--dim)}
.dots{height:26px;flex:none;display:flex;align-items:center;justify-content:center;gap:9px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--off)}
.dots i.on{background:var(--acc);width:24px;border-radius:5px}

/* clima */
.tabs{flex:none;display:flex;gap:10px}
.tab{flex:1;height:52px;border:1px solid var(--line);background:var(--card2);border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px;font:500 var(--f-nm)/1 Inter,sans-serif;color:var(--dim)}
.tab svg{width:18px;height:18px}
.tab.sel{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600}
.ext{flex:none;height:46px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font:500 var(--f-nm)/1 Inter,sans-serif;color:#c3cad6}
.ext svg{width:18px;height:18px;color:var(--acc)}
.zone{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;justify-content:space-between}
.zone .zt{display:flex;align-items:center;gap:9px}
.zone .zt .nm{font:500 var(--f-nm)/1 Inter,sans-serif}
.zone .zt .hum{margin-left:auto;font:400 12px/1 Inter,sans-serif;color:var(--dim)}
.zone .now{font:600 var(--f-val)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.zone .set{display:flex;align-items:center;gap:9px}
.zone .set .b{width:46px;height:42px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font:500 21px/1 Inter,sans-serif;color:var(--dim);background:var(--card2)}
.zone .set .v{flex:1;text-align:center;font:500 var(--f-nm)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.zone .set .v small{display:block;font:400 11px/1 Inter,sans-serif;color:var(--dim);margin-top:5px}
.zone.heat{border-color:#3a2f1a}.zone.heat .now{color:var(--acc)}
.zone.off .now,.zone.off .nm{color:var(--dim)}
.ac{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:11px}
.ac .hd{display:flex;align-items:center;gap:9px}
.ac .hd .nm{font:600 var(--f-nm)/1.2 Inter,sans-serif}
.ac .md{margin-left:auto;display:flex;align-items:center;gap:6px;border-radius:8px;padding:6px 9px;font:600 11px/1 Inter,sans-serif;background:var(--off);color:var(--dim)}
.ac .md svg{width:13px;height:13px}
.ac.cool{border-color:#1d3a4a}.ac.cool .md{background:#12303f;color:var(--cool)}.ac.cool .now{color:var(--cool)}
.ac.hot{border-color:#3a2f1a}.ac.hot .md{background:#2a2313;color:var(--acc)}.ac.hot .now{color:var(--acc)}
.ac .now{font:600 var(--f-val)/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.ac .rows{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ac .row{display:flex;align-items:center;gap:9px;font:400 12.5px/1 Inter,sans-serif;color:var(--dim)}
.ac .row svg{width:15px;height:15px;color:#5d6878}
.ac .row b{margin-left:auto;color:var(--txt);font-weight:500}

/* energia */
.stats{flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat .v{font:600 var(--f-val)/1 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:10px}
.stat .v small{font-size:15px;color:var(--dim);margin-left:3px;font-weight:500}
.stat .s{font:400 12px/1.3 Inter,sans-serif;color:var(--dim);margin-top:7px}
.chart{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 10px;display:flex;flex-direction:column;min-height:0}
.chart .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.chart .hd .t{font:500 var(--f-nm)/1 Inter,sans-serif}
.chart .hd .m{font:400 12px/1 Inter,sans-serif;color:var(--dim);margin-left:auto}
.chart svg{flex:1;width:100%;min-height:0}
.strings{flex:none;display:flex;gap:12px}
.str{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.str .nm{font:500 13.5px/1 Inter,sans-serif}
.str .big{font:600 22px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:9px}
.str .det{display:flex;gap:14px;font:400 12px/1.3 Inter,sans-serif;color:var(--dim);margin-top:6px}

/* telecamere e accessi */
.qgrid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;min-height:0;align-content:start}
.qcam{aspect-ratio:16/9}
.qcam{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#05070a}
.qcam svg.scene{position:absolute;inset:0;width:100%;height:100%}
.qcam .nm{position:absolute;left:12px;bottom:10px;font:500 14px/1 Inter,sans-serif;color:#fff;text-shadow:0 1px 4px #000}
.qcam .lv{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:6px;font:600 11px/1 Inter,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:6px}
.qcam .lv i{width:6px;height:6px;border-radius:50%;background:#e2664f;animation:bl 1.6s infinite}
.qbar{flex:none;height:56px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;gap:18px;padding:0 16px;font:400 12.5px/1 Inter,sans-serif;color:var(--dim)}
.qbar b{color:var(--txt);font-weight:500}
.camtop{flex:none;position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#05070a}
.camtop svg.scene{position:absolute;inset:0;width:100%;height:100%}
.camtop .ov{position:absolute;left:13px;top:12px;display:flex;align-items:center;gap:9px;font:600 12px/1 Inter,sans-serif;color:#fff}
.camtop .live{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px}
.camtop .live i{width:7px;height:7px;border-radius:50%;background:#e2664f;animation:bl 1.6s infinite}
.camtop .ts{position:absolute;right:13px;bottom:11px;font:500 12px/1 Inter,sans-serif;color:#e6eaf0;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px}
.thumbs{flex:none;display:flex;gap:10px}
.th{aspect-ratio:16/9}
.th{flex:1;border:1px solid var(--line);border-radius:11px;overflow:hidden;position:relative;background:#0a0e14}
.th.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.th svg.scene{position:absolute;inset:0;width:100%;height:100%}
.th span{position:absolute;left:8px;bottom:6px;font:500 11.5px/1 Inter,sans-serif;color:#dfe5ee;text-shadow:0 1px 3px #000}
.arow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);flex:1;display:flex;align-items:center;gap:14px;padding:0 16px;min-height:0}
.arow>svg{width:23px;height:23px;color:var(--dim);flex:none}
.arow .nm{font:500 var(--f-nm)/1.15 Inter,sans-serif}
.arow .st{font:400 12.5px/1.3 Inter,sans-serif;color:var(--dim);margin-top:5px}
.btn{margin-left:auto;flex:none;background:var(--acc);color:var(--ink);border-radius:11px;padding:15px 22px;font:600 16px/1 Inter,sans-serif;text-align:center;min-width:118px}
.btn small{display:block;font:500 10px/1 Inter,sans-serif;color:rgba(0,0,0,.55);margin-top:5px}
.arow.luce{border-color:#3a2f1a}
.swbig{margin-left:auto;width:58px;height:32px;border-radius:20px;background:var(--acc);position:relative;flex:none}
.swbig i{position:absolute;top:3px;left:29px;width:26px;height:26px;border-radius:50%;background:var(--ink)}

/* agenda in colonna */
.giorno{flex:none}
.giorno .gh{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.giorno .gh .t{font:600 var(--f-nm)/1 Inter,sans-serif}
.giorno .gh .d{font:400 12.5px/1 Inter,sans-serif;color:var(--dim);margin-left:auto}
.agev{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.agev:first-of-type{border-top:none}
.agev .bl{width:3px;border-radius:3px;background:var(--acc);flex:none}
.agev .bl.b2{background:#4fc39a}.agev .bl.b3{background:#6f9fe0}
.agev .tm{font:600 13px/1.2 Inter,sans-serif;color:var(--dim);width:46px;flex:none;font-variant-numeric:tabular-nums;padding-top:2px}
.agev .tx{font:400 var(--f-nm)/1.3 Inter,sans-serif}
.agev .who{font:400 12px/1.3 Inter,sans-serif;color:var(--dim);margin-top:3px}
.aglg{flex:none;height:46px;display:flex;align-items:center;gap:20px;padding:0 16px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);font:400 12.5px/1 Inter,sans-serif;color:var(--dim)}
.aglg .l{display:flex;align-items:center;gap:8px}
.aglg i{width:9px;height:9px;border-radius:3px;background:var(--acc)}
.aglg i.b2{background:#4fc39a}.aglg i.b3{background:#6f9fe0}

/* wifi */
.qcard{flex:none;background:#fff;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}
.qcard .q{width:100%;max-width:420px;aspect-ratio:1}
.qcard .cap{font:600 14px/1.3 Inter,sans-serif;color:#171b20;margin-top:14px;text-align:center}
.wbox{flex:none}
.wbox .v{font:600 34px/1.15 Inter,sans-serif;margin-top:11px;word-break:break-all}
.wbox .v.mono{font-family:"JetBrains Mono",monospace;font-size:28px;font-weight:500}
.wbox .hd{display:flex;align-items:center;gap:12px}
.wbox .hd .act{margin-left:auto;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:500 13px/1 Inter,sans-serif;color:var(--txt);background:var(--card2)}
.wnote{flex:none;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:11px;font:400 13px/1.55 Inter,sans-serif;color:var(--dim)}
.wnote svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--ok)}
.wbtn{flex:none;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card2);border-radius:var(--r);padding:16px 18px;font:600 var(--f-nm)/1 Inter,sans-serif}
.wbtn svg{width:20px;height:20px;color:var(--dim)}
.wbtn .ar2{margin-left:auto;color:#4a5461}
.wbtn .ar2 svg{width:17px;height:17px}
</style>
</head>

function scene(id){return `
<svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a4d"/><stop offset="1" stop-color="#151d27"/></linearGradient>
  <radialGradient id="lm${id}" cx="50%" cy="50%"><stop offset="0" stop-color="rgba(255,214,150,.5)"/><stop offset="1" stop-color="rgba(255,214,150,0)"/></radialGradient></defs>
  <rect width="640" height="360" fill="url(#sk${id})"/>
  <rect y="150" width="640" height="210" fill="#171d25"/>
  <path d="M0 360 L250 168 L390 168 L640 360 Z" fill="#20272f"/>
  <path d="M60 360 L268 176 L372 176 L580 360 Z" fill="#262e37"/>
  <rect x="0" y="120" width="150" height="130" fill="#1b222b"/><rect x="490" y="120" width="150" height="130" fill="#1b222b"/>
  <circle cx="150" cy="128" r="70" fill="url(#lm${id})"/>
  <g stroke="#39434f" stroke-width="5">
    <path d="M150 150v100M186 150v100M222 150v100M258 152v96M294 154v92M148 160h150M148 236h150"/>
    <path d="M350 154v92M386 152v96M422 150v100M458 150v100M494 150v100M346 160h150M346 236h150"/></g>
  <rect x="300" y="140" width="44" height="120" fill="#2c343d"/></svg>`}
function qr(seed){
  let s=seed,N=25,m=[];
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
  for(let y=0;y<N;y++){m[y]=[];for(let x=0;x<N;x++)m[y][x]=rnd()>0.52?1:0}
  const fp=(ox,oy)=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++){
    const b=(x===0||x===6||y===0||y===6)||(x>1&&x<5&&y>1&&y<5);m[oy+y][ox+x]=b?1:0}
    for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const px=ox+x,py=oy+y;
      if(px>=0&&py>=0&&px<N&&py<N&&(x<0||x>6||y<0||y>6))m[py][px]=0}};
  fp(0,0);fp(N-7,0);fp(0,N-7);
  for(let i=8;i<N-8;i++){m[6][i]=i%2?0:1;m[i][6]=i%2?0:1}
  let r=`<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" style="width:100%;height:100%"><rect width="${N}" height="${N}" fill="#fff"/><g fill="#0d1014">`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return r+'</g></svg>';
}

const S={home,luci,clima,cond,pv,cam,acc,ag,wifi};
const CAP={
 home:`<h3>Home</h3>La barra di navigazione in basso è sempre presente, quindi <b>il dock sparisce</b>: la home torna a essere solo un cruscotto, e recupera lo spazio di sette pulsanti. L'energia sta in alto con tre celle affiancate, presenza e aperture si dividono la fascia centrale, l'agenda del giorno sotto. Sul pannello grande la striscia delle telecamere chiude in basso, con le anteprime in 16:9; sul piccolo non entra e viene omessa.`,
 luci:`<h3>Luci</h3>Due colonne invece di tre o quattro, ma <b>schede più alte</b>: il cursore di luminosità diventa più lungo e quindi più preciso, che in verticale è il guadagno principale. Otto per pagina sul grande, sei sul piccolo.`,
 clima:`<h3>Clima</h3>I due gruppi diventano due schede piene in cima, larghe metà schermo ciascuna: molto più facili da centrare della fascia orizzontale. La temperatura esterna ha una riga sua.`,
 cond:`<h3>Condizionatori</h3>Da quattro colonne strette a <b>una griglia 2×2 di schede quadrate</b>: è il caso in cui la verticale funziona meglio dell'orizzontale, perché ogni unità ha spazio per il setpoint e le tre righe di stato senza comprimere nulla.`,
 pv:`<h3>Energia</h3>I quattro riquadri passano da una riga a una griglia 2×2, il grafico della giornata resta ampio e le due stringhe si affiancano in fondo. Nessuna perdita rispetto all'orizzontale.`,
 cam:`<h3>Telecamere</h3>Ogni riquadro rispetta il <b>rapporto 16:9 delle telecamere</b>: le immagini non vengono né tagliate né deformate. Due colonne di riquadri bassi e larghi, e in verticale ci sta molto: sul pannello grande <b>tutte e otto insieme</b>, senza paginazione; sul piccolo sei per pagina.`,
 acc:`<h3>Accessi</h3><b>La schermata che guadagna di più.</b> La telecamera occupa tutta la larghezza in alto <b>nel suo rapporto 16:9 naturale</b>, le miniature sotto, e i quattro comandi diventano righe piene larghe quanto lo schermo: il pulsante Apri è enorme e impossibile da sbagliare. È il formato naturale per un pannello accanto al campanello.`,
 ag:`<h3>Agenda</h3>Le colonne per giorno non hanno senso in verticale: diventa <b>un elenco unico con intestazioni di giorno</b>, che è anche il modo in cui si legge un'agenda. Più giorni visibili insieme rispetto all'orizzontale.`,
 wifi:`<h3>Wi-Fi</h3>Il codice QR va a tutta larghezza, quindi <b>più grande che in orizzontale</b> e leggibile da più lontano. Nome e password sotto, uno per riga, senza comprimere.`
};

let prof='p4', scr='home';
const DIM={p4:[800,1280]};
function render(){
  const [w,h]=DIM[prof];
  const st=document.getElementById('stage');
  st.style.width=w+'px'; st.style.height=h+'px';
  st.innerHTML=S[scr](prof);
  document.getElementById('cap').innerHTML=CAP[scr];
  document.querySelectorAll('#gr button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===prof)));
  document.querySelectorAll('#gs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===scr)));
  fit();
}
function fit(){
  const [w,h]=DIM[prof];
  const frame=document.getElementById('frame');
  const disp=Math.min(760, window.innerHeight-160);
  const s=Math.min(1, disp/h);
  document.getElementById('stage').style.transform='scale('+s+')';
  frame.style.width=(w*s+24)+'px'; frame.style.height=(h*s+24)+'px';
}
document.querySelectorAll('#gr button').forEach(b=>b.onclick=()=>{prof=b.dataset.p;render()});
document.querySelectorAll('#gs button').forEach(b=>b.onclick=()=>{scr=b.dataset.s;render()});
addEventListener('resize',fit);
render();
</script>
