<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foyer Panel · pannello 10.1" · stati e flussi · 1280×800</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#15171b;color:#d8dce3;font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1400px;margin:0 auto;padding:18px 14px 60px}
h1.tt{font-size:15px;font-weight:600;margin:0 0 2px;color:#e6e9ee}
p.sub{font-size:12.5px;color:#8b929e;margin:0 0 14px}
.grp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.grp .lb{font:500 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6d747f;margin-right:4px}
.grp button{appearance:none;border:1px solid #2c3038;background:#1c1f25;color:#aeb5c0;font:500 12.5px/1 Inter,sans-serif;padding:9px 12px;border-radius:8px;cursor:pointer}
.grp button:hover{border-color:#3d434e;color:#e6e9ee}
.grp button[aria-pressed="true"]{background:#e6e9ee;color:#15171b;border-color:#e6e9ee}
.frame{position:relative;background:#000;border:12px solid #24272d;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.5);overflow:hidden;margin:14px auto 0}
.stage{width:1280px;height:800px;transform-origin:top left;position:relative;overflow:hidden}
.caption{font-size:12.5px;color:#9aa1ad;margin:12px 2px 0;line-height:1.6;max-width:980px}
.caption b{color:#e6e9ee;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.screen{position:absolute;inset:0;width:1280px;height:800px;display:flex;overflow:hidden;
  --bg:#0d1014;--card:#151a21;--card2:#11161c;--line:#1e242d;--txt:#e8ecf2;--dim:#8a95a6;
  --acc:#f0a835;--ok:#4fc39a;--warn:#e2664f;--r:16px;--ink:#0d1014;--off:#232b35;
  background:var(--bg);color:var(--txt)}
.col{flex-direction:column}

.mrail{width:106px;flex:none;background:var(--card2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:9px}
.mhome{width:88px;height:66px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--acc);margin-bottom:8px;flex:none}
.mhome svg{width:25px;height:25px}
.mhome span{font:600 11px/1 Inter,sans-serif;letter-spacing:.1em}
.mitem{width:88px;flex:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#6f7b8c;margin-bottom:4px}
.mitem svg{width:24px;height:24px}
.mitem span{font:500 11px/1 Inter,sans-serif}
.mitem.sel{background:#221c0e;color:var(--acc);box-shadow:inset 0 0 0 1px #4a3c1c}
.mitem.dis{opacity:.35}
.mgear{width:88px;height:56px;flex:none;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#6f7b8c;margin-top:4px}
.mgear svg{width:22px;height:22px}
.mgear span{font:500 11px/1 Inter,sans-serif}
.mgear.sel{color:var(--acc)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mhead{height:66px;flex:none;display:flex;align-items:center;padding:0 22px;gap:16px}
.mhead .ti{font:600 26px/1 Inter,sans-serif}
.mhead .cr{font:400 14px/1 Inter,sans-serif;color:var(--dim)}
.mhead .clock{margin-left:auto;font:400 24px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--dim)}
.mhead .cd{margin-left:auto;font:500 15px/1 Inter,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:9px;margin-left:auto}
.pager .ar{width:48px;height:44px;border:1px solid var(--line);background:var(--card2);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.pager .ar svg{width:20px;height:20px}
.pager .ar.off{opacity:.3}
.pager .n{font:500 14px/1 Inter,sans-serif;color:var(--dim);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.dots{height:28px;flex:none;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--off)}
.dots i.on{background:var(--acc);width:24px;border-radius:5px}
.content{flex:1;min-height:0;padding:4px 20px 18px;display:flex;flex-direction:column}
.k{font:600 12px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.spin{width:19px;height:19px;border-radius:50%;border:2px solid rgba(240,168,53,.28);border-top-color:var(--acc);animation:sp .9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bl{50%{opacity:.25}}

/* griglia luci 4x2 */
.g4{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:14px;min-height:0}
.lc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;justify-content:space-between}
.lc .top{display:flex;align-items:center;gap:11px}
.lc .top svg{width:22px;height:22px;color:var(--dim)}
.lc .nm{font:500 17px/1 Inter,sans-serif}
.lc .sw{margin-left:auto;width:58px;height:32px;border-radius:20px;background:var(--off);position:relative}
.lc .sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#6b7686}
.lc.on .sw{background:var(--acc)}
.lc.on .sw i{left:29px;background:var(--ink)}
.lc .pct{font:600 34px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.lc .pct span{font-size:17px;color:var(--dim)}
.lc .track{height:9px;border-radius:6px;background:var(--off);position:relative;overflow:hidden}
.lc .track i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:6px}
.lc.off .pct,.lc.off .nm{color:var(--dim)}
.lc.stale{opacity:.45}
.lc.ghost{border-style:dashed;opacity:.25}

/* banner */
.banner{height:58px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;background:#251d0e;border-bottom:1px solid #4a3c1c;color:#f0c987;font:500 15px/1 Inter,sans-serif}
.banner .sp2{margin-left:auto;font:400 14px/1 Inter,sans-serif;color:#a2865a;font-variant-numeric:tabular-nums}

/* accessi */
.acc{flex:1;display:flex;gap:16px;min-height:0}
.cam{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.camview{flex:1;position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#05070a;min-height:0}
.camview svg.scene{position:absolute;inset:0;width:100%;height:100%}
.camview .ov{position:absolute;left:14px;top:13px;display:flex;align-items:center;gap:10px;font:600 13px/1 Inter,sans-serif;color:#fff}
.camview .live{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:7px}
.camview .live i{width:8px;height:8px;border-radius:50%;background:#e2664f;animation:bl 1.6s infinite}
.camview .rate{position:absolute;left:14px;bottom:12px;font:500 12.5px/1 Inter,sans-serif;color:#cfd6e0;background:rgba(0,0,0,.55);padding:7px 10px;border-radius:7px}
.camview .ts{position:absolute;right:14px;bottom:12px;font:500 13px/1 Inter,sans-serif;color:#e6eaf0;background:rgba(0,0,0,.55);padding:7px 10px;border-radius:7px;font-variant-numeric:tabular-nums}
.thumbs{height:96px;flex:none;display:flex;gap:12px}
.th{flex:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:#0a0e14}
.th.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.th svg.scene{position:absolute;inset:0;width:100%;height:100%}
.th span.n{position:absolute;left:10px;bottom:8px;font:500 13px/1 Inter,sans-serif;color:#dfe5ee;text-shadow:0 1px 3px #000}
.ctrls{width:400px;flex:none;display:flex;flex-direction:column;gap:12px}
.arow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);flex:1;display:flex;align-items:center;gap:15px;padding:0 16px}
.arow>svg{width:24px;height:24px;color:var(--dim);flex:none}
.arow .nm{font:500 17px/1.15 Inter,sans-serif}
.arow .st{font:400 13px/1.3 Inter,sans-serif;color:var(--dim);margin-top:5px}
.arow.active{border-color:#4a3c1c;background:#181c1a}
.btn{margin-left:auto;flex:none;background:var(--acc);color:var(--ink);border-radius:11px;padding:15px 20px;font:600 16px/1 Inter,sans-serif;text-align:center;min-width:132px;display:flex;align-items:center;justify-content:center;gap:9px}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.wait{background:#2a2313;color:#f0c987;border:1px solid #4a3c1c}
.btn.done{background:#16301f;color:#7ddba6;border:1px solid #2c5a3d}
.btn.fail{background:#2e1a17;color:#f09287;border:1px solid #5a2f28}
.btn small{display:block;font:500 11px/1 Inter,sans-serif;color:rgba(0,0,0,.55);margin-top:6px}
.btn.ghost small{color:var(--dim)}
.btn svg{width:18px;height:18px}
.btn .spin{width:17px;height:17px}
.log{height:72px;flex:none;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:11px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.log .ln{font:400 13.5px/1.2 Inter,sans-serif;color:var(--dim);font-variant-numeric:tabular-nums}
.log .ln b{color:var(--txt);font-weight:500}
.camdead{flex:1;border:1px solid var(--line);border-radius:var(--r);background:#0a0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
.camdead svg{width:44px;height:44px;color:#3f4a5a}
.camdead .t{font:500 17px/1 Inter,sans-serif;color:var(--dim)}
.camdead .s{font:400 13.5px/1 Inter,sans-serif;color:#5d6878}
.skel{position:absolute;inset:0;background:linear-gradient(90deg,#12171e 20%,#1b222c 40%,#12171e 60%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-20% 0}}

/* toast */
.toast{position:absolute;left:130px;right:22px;bottom:18px;height:72px;border-radius:14px;display:flex;align-items:center;gap:15px;padding:0 20px;font:500 16px/1.3 Inter,sans-serif}
.toast svg{width:24px;height:24px;flex:none}
.toast .s{font:400 13.5px/1.35 Inter,sans-serif;opacity:.75;margin-top:4px}
.toast.ok{background:#13251c;border:1px solid #2c5a3d;color:#a9e3c3}
.toast.ok svg{color:#4fc39a}
.toast.err{background:#271815;border:1px solid #5a2f28;color:#f3b5ac}
.toast.err svg{color:var(--warn)}
.toast .act{margin-left:auto;border:1px solid currentColor;border-radius:10px;padding:13px 19px;font:600 15px/1 Inter,sans-serif;opacity:.9}

/* modale */
.veil{position:absolute;inset:0;background:rgba(5,7,10,.76);display:flex;align-items:center;justify-content:center}
.modal{width:600px;background:var(--card);border:1px solid #2b323d;border-radius:20px;padding:30px 32px 26px;text-align:center}
.modal .ic{width:64px;height:64px;border-radius:50%;background:#221c0e;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.modal .ic svg{width:32px;height:32px;color:var(--acc)}
.modal .t{font:600 27px/1.25 Inter,sans-serif}
.modal .s{font:400 15px/1.5 Inter,sans-serif;color:var(--dim);margin-top:11px}
.modal .btns{display:flex;gap:14px;margin-top:26px}
.modal .b{flex:1;border-radius:13px;padding:19px 0;font:600 18px/1 Inter,sans-serif}
.modal .b.no{border:1px solid var(--line);color:var(--txt);background:var(--card2)}
.modal .b.yes{background:var(--acc);color:var(--ink)}
.modal .cdw{font:400 13px/1 Inter,sans-serif;color:#5d6878;margin-top:16px}

/* PIN */
.pinbox{width:740px;background:var(--card);border:1px solid #2b323d;border-radius:20px;padding:28px 30px;display:flex;gap:30px}
.pinleft{flex:1;display:flex;flex-direction:column;justify-content:center}
.pinleft .ic{width:54px;height:54px;border-radius:50%;background:#221c0e;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.pinleft .ic svg{width:27px;height:27px;color:var(--acc)}
.pinleft .t{font:600 24px/1.3 Inter,sans-serif}
.pinleft .s{font:400 14.5px/1.5 Inter,sans-serif;color:var(--dim);margin-top:10px}
.pindots{display:flex;gap:15px;margin-top:22px}
.pindots i{width:19px;height:19px;border-radius:50%;border:2px solid #3a434f}
.pindots i.f{background:var(--acc);border-color:var(--acc)}
.pinleft .att{font:400 13px/1 Inter,sans-serif;color:#6f7b8c;margin-top:20px}
.pad{width:336px;flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad .p{height:72px;background:var(--card2);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font:500 27px/1 Inter,sans-serif}
.pad .p.f{font-size:14px;color:var(--dim)}

/* wifi privata */
.wsplit{flex:1;display:flex;gap:18px;min-height:0}
.qcard{width:470px;flex:none;background:#fff;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.qcard .q{width:360px;height:360px}
.qcard .cap{font:600 15px/1.3 Inter,sans-serif;color:#171b20;margin-top:18px;text-align:center}
.wside{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.wbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 20px}
.wbox .v{font:600 40px/1.15 Inter,sans-serif;margin-top:12px;word-break:break-all}
.wbox .v.mono{font-family:"JetBrains Mono",monospace;font-size:34px;font-weight:500}
.wbox .hd{display:flex;align-items:center;gap:12px}
.wbox .hd .act{margin-left:auto;border:1px solid var(--line);border-radius:10px;padding:11px 15px;font:500 14px/1 Inter,sans-serif;color:var(--txt);background:var(--card2)}
.wnote{border-radius:var(--r);padding:15px 18px;display:flex;gap:12px;align-items:flex-start;font:400 13.5px/1.55 Inter,sans-serif}
.wnote svg{width:18px;height:18px;flex:none;margin-top:1px}
.wnote.warn{background:#251d0e;border:1px solid #4a3c1c;color:#f0c987}
.wnote.warn svg{color:var(--acc)}
.wbtn{margin-top:auto;display:flex;align-items:center;gap:13px;border:1px solid var(--line);background:var(--card2);border-radius:var(--r);padding:17px 20px;font:600 17px/1 Inter,sans-serif}
.wbtn svg{width:22px;height:22px;color:var(--dim)}
.wbtn .ar{margin-left:auto;color:#4a5461}
.wbtn .ar svg{width:19px;height:19px}

/* impostazioni */
.setwrap{flex:1;display:flex;gap:14px;min-height:0}
.setmenu{width:280px;flex:none;display:flex;flex-direction:column;gap:10px}
.smi{background:var(--card);border:1px solid var(--line);border-radius:13px;flex:1;display:flex;align-items:center;gap:13px;padding:0 17px;font:500 16px/1 Inter,sans-serif;color:var(--dim)}
.smi svg{width:21px;height:21px}
.smi.sel{background:#221c0e;border-color:#4a3c1c;color:var(--acc)}
.setpane{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;min-width:0}
.srow{display:flex;align-items:center;gap:16px;padding:15px 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:none;padding-top:4px}
.srow .nm{font:500 16px/1.2 Inter,sans-serif}
.srow .st{font:400 13.5px/1.3 Inter,sans-serif;color:var(--dim);margin-top:5px}
.srow .act{margin-left:auto;flex:none;border:1px solid var(--line);border-radius:10px;padding:13px 17px;font:500 15px/1 Inter,sans-serif;color:var(--txt);background:var(--card2)}
.srow .act.acc{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600}
.srow .val{margin-left:auto;font:500 17px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.sw2{margin-left:auto;width:58px;height:32px;border-radius:20px;background:var(--off);position:relative;flex:none}
.sw2 i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#6b7686}
.sw2.on{background:var(--acc)}.sw2.on i{left:29px;background:var(--ink)}
.slider{flex:1;height:11px;border-radius:6px;background:var(--off);position:relative;margin:0 8px;max-width:280px;margin-left:auto}
.slider i{position:absolute;inset:0 auto 0 0;width:62%;background:var(--acc);border-radius:6px}
.slider u{position:absolute;top:50%;left:62%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff}
.snote{margin-top:auto;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:400 13.5px/1.55 Inter,sans-serif;color:var(--dim)}
.snote b{color:var(--txt);font-weight:600}

/* avvio */
.boot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.boot .logo{width:84px;height:84px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.boot .logo svg{width:40px;height:40px;color:var(--acc)}
.boot .nm{font:300 38px/1 Inter,sans-serif;letter-spacing:-.02em}
.boot .vr{font:400 14px/1 Inter,sans-serif;color:#5d6878;margin-top:12px}
.boot .list{width:470px;margin-top:38px;display:flex;flex-direction:column;gap:3px}
.bl{display:flex;align-items:center;gap:14px;padding:13px 5px;font:400 16px/1 Inter,sans-serif;color:var(--dim)}
.bl .ic{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center}
.bl .ic svg{width:19px;height:19px}
.bl.done{color:#9fb0a8}.bl.done .ic svg{color:var(--ok)}
.bl.now{color:var(--txt)}
.bl .rs{margin-left:auto;font:400 13.5px/1 Inter,sans-serif;color:#5d6878;font-variant-numeric:tabular-nums}
.bl.wait{opacity:.42}
.bl .dotwait{width:8px;height:8px;border-radius:50%;background:#3f4a5a}
.boot .pb{width:470px;height:6px;border-radius:4px;background:var(--off);margin-top:28px;overflow:hidden;position:relative}
.boot .pb i{position:absolute;inset:0 auto 0 0;width:64%;background:var(--acc);border-radius:4px}
.boot .hint{font:400 13.5px/1 Inter,sans-serif;color:#5d6878;margin-top:18px}

/* HA giù */
.offwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 50px}
.offwrap .ic{width:88px;height:88px;border-radius:50%;background:#2a1a16;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.offwrap .ic svg{width:42px;height:42px;color:var(--warn)}
.offwrap .t{font:600 31px/1.25 Inter,sans-serif}
.offwrap .s{font:400 16.5px/1.6 Inter,sans-serif;color:var(--dim);margin-top:14px;max-width:640px}
.offwrap .btns{display:flex;gap:14px;margin-top:28px}
.offwrap .b{border-radius:13px;padding:17px 30px;font:600 16px/1 Inter,sans-serif;background:var(--acc);color:var(--ink)}
.offwrap .b.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.offtop{position:absolute;left:0;right:0;top:0;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;color:var(--dim);font:400 15px/1 Inter,sans-serif}
.offtop .cl{font:500 24px/1 Inter,sans-serif;color:var(--txt);font-variant-numeric:tabular-nums}

/* primo avvio */
.first{flex:1;display:flex;flex-direction:column;padding:30px 34px}
.first .top{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.first .top .t{font:600 30px/1 Inter,sans-serif}
.steps{margin-left:auto;display:flex;gap:9px;align-items:center}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--off)}
.steps i.on{background:var(--acc)}
.first .body{flex:1;display:flex;gap:20px;min-height:0}

.wf.sel svg{color:var(--acc)}
.qrbox{width:360px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.qrsm{width:210px;height:210px;background:#fff;border-radius:12px;margin:14px 0 16px;padding:12px}
.qrbox .t{font:500 16px/1.3 Inter,sans-serif}
.qrbox .s{font:400 13.5px/1.55 Inter,sans-serif;color:var(--dim);margin-top:10px}

/* tastiera */
.kb{flex:1;display:flex;flex-direction:column;padding:18px 20px 16px}
.kbtop{height:56px;flex:none;display:flex;align-items:center;gap:14px}
.kbtop .t{font:600 22px/1 Inter,sans-serif}
.kbtop .s{font:400 14px/1 Inter,sans-serif;color:var(--dim)}
.kbfield{height:86px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;padding:0 20px;gap:16px;margin:8px 0 12px}
.kbfield .lb{font:400 14px/1 Inter,sans-serif;color:var(--dim)}
.kbfield .vv{font:500 26px/1 Inter,sans-serif;letter-spacing:.2em}
.kbfield .car{width:2px;height:30px;background:var(--acc);animation:bl2 1.1s infinite}
@keyframes bl2{50%{opacity:0}}
.kbfield .eye{margin-left:auto;font:500 14px/1 Inter,sans-serif;color:var(--dim);border:1px solid var(--line);border-radius:9px;padding:12px 15px}
.kbrows{flex:none;height:452px;display:flex;flex-direction:column;gap:10px;margin-top:auto}
.kbrow{flex:1;display:flex;gap:9px;justify-content:center}
.key{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;display:flex;align-items:center;justify-content:center;font:500 23px/1 Inter,sans-serif;color:var(--txt)}
.key.wide{flex:1.6;font-size:15px;color:var(--dim)}
.key.ok{flex:2.2;background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600;font-size:18px}
.key.sp{flex:5}

/* standby */
.sb{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 64px;opacity:.62}
.sb .t{font:200 160px/1 Inter,sans-serif;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.sb .d{font:400 22px/1 Inter,sans-serif;color:var(--dim);margin-top:14px}
.sb .row{display:flex;gap:44px;margin-top:44px;flex-wrap:wrap}
.sb .row .i{display:flex;align-items:center;gap:13px;font:400 18px/1 Inter,sans-serif;color:#aab3c1}
.sb .row .i svg{width:22px;height:22px;color:#6f7b8c}
.sb .row .i b{color:var(--txt);font-weight:500}
</style>

<script>
function scene(id){return `
<svg class="scene" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="sk${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3a4d"/><stop offset="1" stop-color="#151d27"/></linearGradient>
  <radialGradient id="lm${id}" cx="50%" cy="50%"><stop offset="0" stop-color="rgba(255,214,150,.5)"/><stop offset="1" stop-color="rgba(255,214,150,0)"/></radialGradient></defs>
  <rect width="640" height="360" fill="url(#sk${id})"/>
  <rect y="150" width="640" height="210" fill="#171d25"/>
  <path d="M0 360 L250 168 L390 168 L640 360 Z" fill="#20272f"/>
  <path d="M60 360 L268 176 L372 176 L580 360 Z" fill="#262e37"/>
  <rect x="0" y="120" width="150" height="130" fill="#1b222b"/><rect x="490" y="120" width="150" height="130" fill="#1b222b"/>
  <circle cx="150" cy="128" r="70" fill="url(#lm${id})"/>
  <g stroke="#39434f" stroke-width="5">
    <path d="M150 150v100M186 150v100M222 150v100M258 152v96M294 154v92M148 160h150M148 236h150"/>
    <path d="M350 154v92M386 152v96M422 150v100M458 150v100M494 150v100M346 160h150M346 236h150"/></g>
  <rect x="300" y="140" width="44" height="120" fill="#2c343d"/>
</svg>`}
function qr(seed){
  let s=seed,N=25,m=[];
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
  for(let y=0;y<N;y++){m[y]=[];for(let x=0;x<N;x++)m[y][x]=rnd()>0.52?1:0}
  const fp=(ox,oy)=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++){
    const b=(x===0||x===6||y===0||y===6)||(x>1&&x<5&&y>1&&y<5);m[oy+y][ox+x]=b?1:0}
    for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const px=ox+x,py=oy+y;
      if(px>=0&&py>=0&&px<N&&py<N&&(x<0||x>6||y<0||y>6))m[py][px]=0}};
  fp(0,0);fp(N-7,0);fp(0,N-7);
  for(let i=8;i<N-8;i++){m[6][i]=i%2?0:1;m[i][6]=i%2?0:1}
  let r=`<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" style="width:100%;height:100%"><rect width="${N}" height="${N}" fill="#fff"/><g fill="#0d1014">`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return r+'</g></svg>';
}

const NAV=[['luci','Luci','i-bulb'],['clima','Clima','i-thermo'],['pv','Energia','i-sun'],['cam','Telecamere','i-cam'],['acc','Accessi','i-gate'],['ag','Agenda','i-cal'],['wifi','Wi-Fi','i-wifi']];
function rail(sel,dis,gear){return `<nav class="mrail">
  <div class="mhome"><svg><use href="#i-home"/></svg><span>HOME</span></div>
  ${NAV.map(([id,lb,ic])=>`<div class="mitem ${id===sel?'sel':''} ${dis&&id!==sel?'dis':''}"><svg><use href="#${ic}"/></svg><span>${lb}</span></div>`).join('')}
  <div class="mgear ${gear?'sel':''}"><svg><use href="#i-gear"/></svg><span>Impost.</span></div></nav>`}
function shell(sel,ti,cr,corpo,extra,dis,gear,right){
  return `<section class="screen">${rail(sel,dis,gear)}
  <div class="main">${extra||''}
    <div class="mhead"><div class="ti">${ti}</div><div class="cr">${cr}</div>${right||'<div class="clock">18:42</div>'}</div>
    <div class="content">${corpo}</div>
  </div></section>`;
}

    <div class="log" style="height:84px"><div class="ln">L'apertura funziona anche senza immagine: il comando passa da Home Assistant,</div>
      <div class="ln">non dalla telecamera.</div></div>
  </div></div>`);

/* ---- avvio ---- */
const AVVIO=`<section class="screen col"><div class="boot">
  <div class="logo"><svg><use href="#i-home"/></svg></div>
  <div class="nm">Ingresso</div>
  <div class="vr">firmware 1.0.4 · avvio in corso</div>
  <div class="list">
    <div class="bl done"><span class="ic"><svg><use href="#i-check"/></svg></span>Rete Wi-Fi 6 · CasaWiFi<span class="rs">0,9 s</span></div>
    <div class="bl done"><span class="ic"><svg><use href="#i-check"/></svg></span>Co-processore ESP32-C6<span class="rs">0,3 s</span></div>
    <div class="bl done"><span class="ic"><svg><use href="#i-check"/></svg></span>Orologio sincronizzato<span class="rs">0,4 s</span></div>
    <div class="bl now"><span class="ic"><span class="spin"></span></span>Home Assistant<span class="rs">…</span></div>
    <div class="bl wait"><span class="ic"><span class="dotwait"></span></span>Telecamere</div>
    <div class="bl wait"><span class="ic"><span class="dotwait"></span></span>Primo aggiornamento dati</div>
  </div>
  <div class="pb"><i></i></div>
  <div class="hint">se qualcosa non risponde, il pannello parte lo stesso in sola lettura</div>
</div></section>`;

/* ---- HA giù ---- */
const HAOFF=`<section class="screen col">
  <div class="offtop"><span>Wi-Fi connesso · 192.0.2.21</span><span class="cl">18:42</span></div>
  <div class="offwrap">
    <div class="ic"><svg><use href="#i-cloudoff"/></svg></div>
    <div class="t">Home Assistant non risponde</div>
    <div class="s">I comandi non sono disponibili. Gli ultimi dati risalgono alle 18:39, tre minuti fa. Il pannello riprova da solo ogni 15 secondi.</div>
    <div class="btns"><div class="b">Riprova ora</div><div class="b ghost">Impostazioni</div></div>
  </div></section>`;

/* ---- standby ---- */
const SB=`<section class="screen col"><div class="sb">
  <div class="t">18:42</div>
  <div class="d">giovedì 13 agosto · 27° sereno</div>
  <div class="row">
    <div class="i"><svg><use href="#i-person"/></svg>In casa <b>2</b></div>
    <div class="i"><svg><use href="#i-bolt"/></svg>Sole <b>3,42 kW</b></div>
    <div class="i"><svg><use href="#i-bulb"/></svg><b>4</b> luci accese</div>
    <div class="i"><svg><use href="#i-cal"/></svg><b>19:30</b> cena da amici</div>
  </div></div></section>`;

/* ---- impostazioni ---- */
const SET=shell('','Impostazioni','pannello ingresso 10,1" · versione 1.0',
`<div class="setwrap">
  <div class="setmenu">
    <div class="smi sel"><svg><use href="#i-wifi"/></svg>Rete</div>
    <div class="smi"><svg><use href="#i-home"/></svg>Home Assistant</div>
    <div class="smi"><svg><use href="#i-screen"/></svg>Schermo</div>
    <div class="smi"><svg><use href="#i-cam"/></svg>Telecamere</div>
    <div class="smi"><svg><use href="#i-info"/></svg>Sistema</div>
  </div>
  <div class="setpane">
    <div class="srow"><div><div class="nm">Rete connessa</div><div class="st">CasaWiFi · Wi-Fi 6 · segnale −48 dBm</div></div><div class="act">Cambia rete</div></div>
    <div class="srow"><div><div class="nm">Indirizzo IP</div><div class="st">assegnato da DHCP</div></div><div class="val">192.0.2.21</div></div>
    <div class="srow"><div><div class="nm">Home Assistant</div><div class="st">connesso · ultimo aggiornamento 2 s fa</div></div><div class="act">Riprova</div></div>
    <div class="srow"><div><div class="nm">Luminosità</div><div class="st">al minimo dopo 2 minuti, spenta dopo 10</div></div><div class="slider"><i></i><u></u></div></div>
    <div class="srow"><div><div class="nm">Consenti configurazione</div><div class="st">apre pannello.local per 15 minuti, poi si richiude</div></div><div class="sw2"><i></i></div></div>
    <div class="srow"><div><div class="nm">Riavvia il pannello</div><div class="st">nessuna impostazione viene persa</div></div><div class="act acc">Riavvia</div></div>
    <div class="snote">Le impostazioni avanzate — entità, calendari, telecamere, nomi delle stanze — si configurano da <b>http://pannello.local</b> con telefono o computer.</div>
  </div></div>`,null,false,true);

/* ---- primo avvio ---- */
const FIRST=`<section class="screen col"><div class="first">
  <div class="top"><div class="t">Scegli la rete Wi-Fi</div><div class="steps"><i class="on"></i><i></i><i></i></div></div>
  <div class="body">
    <div class="wifis">
      ${[['CasaWiFi','protetta',1],['CasaWiFi_5G','protetta',0],['CasaOspiti','protetta',0],['FRITZ!Box 7530','protetta',0],['Vicini-2.4','protetta',0],['Altra rete…','manuale',0]]
        .map(([n,l,s])=>`<div class="wf ${s?'sel':''}"><svg><use href="#i-wifi"/></svg><span class="nm">${n}</span><span class="lock">${l}</span></div>`).join('')}
    </div>
    <div class="qrbox">
      <div class="t">Oppure dal telefono</div>
      <div class="qrsm">${qr(11)}</div>
      <div class="s">Inquadra il codice: il telefono si collega al pannello e la configurazione prosegue lì, con la tastiera vera.</div>
    </div>
  </div></div></section>`;

/* ---- tastiera ---- */
const R1='qwertyuiop'.split(''),R2='asdfghjkl'.split(''),R3='zxcvbnm'.split('');
const KB=`<section class="screen col"><div class="kb">
  <div class="kbtop"><div class="t">Password della rete</div><div class="s">passo 1 di 3 · CasaWiFi</div></div>
  <div class="kbfield"><span class="lb">Password</span><span class="vv">••••••••••</span><span class="car"></span>
    <span class="eye">Mostra</span></div>
  <div class="kbrows">
    <div class="kbrow">${R1.map(c=>`<div class="key">${c}</div>`).join('')}</div>
    <div class="kbrow">${R2.map(c=>`<div class="key">${c}</div>`).join('')}</div>
    <div class="kbrow"><div class="key wide">MAIUSC</div>${R3.map(c=>`<div class="key">${c}</div>`).join('')}<div class="key wide">CANC</div></div>
    <div class="kbrow"><div class="key wide">123</div><div class="key wide">@#€</div><div class="key sp">spazio</div><div class="key ok">Connetti</div></div>
  </div></div></section>`;

/* ---- PIN ---- */
const PIN=`<section class="screen">${rail('wifi')}
  <div class="main"><div class="mhead"><div class="ti">Wi-Fi</div><div class="cr">rete privata</div><div class="clock">18:42</div></div>
    <div class="content"><div class="wsplit" style="opacity:.2"><div class="qcard"><div class="q">${qr(3)}</div></div>
      <div class="wside"><div class="wbox"><div class="k">Nome rete</div><div class="v">•••••••</div></div></div></div></div></div>
  <div class="veil"><div class="pinbox">
    <div class="pinleft">
      <div class="ic"><svg><use href="#i-lock"/></svg></div>
      <div class="t">Rete privata</div>
      <div class="s">Inserisci il PIN per mostrare il codice di collegamento.</div>
      <div class="pindots"><i class="f"></i><i class="f"></i><i></i><i></i></div>
      <div class="att">3 tentativi rimasti prima del blocco di 5 minuti</div>
    </div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="p">${n}</div>`).join('')}
      <div class="p f">Annulla</div><div class="p">0</div><div class="p f">Canc</div></div>
  </div></div></section>`;

/* ---- privata sbloccata ---- */
const PRIV=shell('wifi','Wi-Fi privata','visibile temporaneamente',
`<div class="wsplit">
  <div class="qcard"><div class="q">${qr(19)}</div><div class="cap">Inquadra con la fotocamera del telefono</div></div>
  <div class="wside">
    <div class="wbox"><div class="k">Nome rete</div><div class="v">CasaWiFi</div></div>
    <div class="wbox"><div class="hd"><div class="k">Password</div><div class="act">Mostra</div></div>
      <div class="v mono" style="color:#8a95a6">•••••••••••••</div></div>
    <div class="wnote warn"><svg><use href="#i-warn"/></svg>
      Questa è la rete di casa: chi si collega raggiunge telecamere, Home Assistant e tutti i dispositivi. Condividila solo con chi vive qui.</div>
    <div class="wbtn"><svg><use href="#i-wifi"/></svg>Torna alla rete ospiti<span class="ar"><svg><use href="#i-right"/></svg></span></div>
  </div></div>`,null,false,false,'<div class="cd">si nasconde tra 0:42</div>');

const S={inv:accessi('wait'),ok:accessi('done',null,TOAST_OK),ko:accessi('fail',null,TOAST_KO),
 conf:accessi('idle',MODAL),avvio:AVVIO,ric:RIC,haoff:HAOFF,camoff:CAMOFF,sb:SB,
 set:SET,first:FIRST,kb:KB,pin:PIN,priv:PRIV,pag:PAG};
const CAP={
 inv:"<b>Comando in corso.</b> Il pulsante diventa lo stato: rotellina e «Invio…», riga evidenziata. Con la telecamera in diretta dietro, il riscontro visivo è doppio — vedi il pulsante e vedi il cancello.",
 ok:"<b>Comando riuscito.</b> Pulsante verde per tre secondi e avviso in basso, che resta onesto sul limite: Home Assistant ha accettato il comando, non che il cancello si sia aperto. Con entità switch è tutto ciò che si può affermare.",
 ko:"<b>Comando fallito.</b> Pulsante rosso, «Riprova» a portata di pollice e la frase che serve a chi è davanti al cancello. Non sparisce da solo: resta finché non lo tocchi.",
 conf:"<b>Conferma di apertura.</b> Riquadro da 600 px, tasti da 19 px di altezza interna e ben distanti. C'è spazio perché la telecamera resti visibile dietro il velo: vedi già chi stai facendo entrare mentre confermi.",
 avvio:"<b>Avvio.</b> C'è un passo in più: il co-processore ESP32-C6 che fornisce Wi-Fi 6 e Bluetooth va inizializzato e va dichiarato, perché è un pezzo che può fallire per conto suo.",
 ric:"<b>Riconnessione.</b> Fascia ambra, valori sbiaditi ma visibili — sono veri, solo vecchi — e le altre sezioni del rail attenuate. Distinta dalla schermata piena: qui si sta ancora riprovando.",
 haoff:"<b>Home Assistant irraggiungibile.</b> Schermata piena, con l'ora dell'ultimo dato valido e la frequenza dei tentativi. In alto restano rete e orologio: l'ora viene da NTP e continua a funzionare.",
 camoff:"<b>Telecamera offline.</b> Il riquadro lo dice a parole e non finge; la miniatura in attesa usa l'animazione di caricamento. I comandi restano attivi, con accanto la ragione.",
 sb:"<b>Standby.</b> Orologio da 160 px, leggibile dall'altro capo del corridoio. Dopo due minuti la retroilluminazione scende al minimo; ogni tre minuti l'intero contenuto si sposta di pochi pixel per evitare la ritenzione d'immagine.",
 set:"<b>Impostazioni a bordo.</b> Solo ciò che serve quando la rete non va. Qui c'è anche l'interruttore che apre la pagina web di configurazione per quindici minuti: è il perno del modello di sicurezza.",
 first:"<b>Primo avvio.</b> Righe di rete alte 110 px e il QR per proseguire dal telefono. Tre passi: rete, Home Assistant, prova di collegamento.",
 kb:"<b>Tastiera.</b> Tasti da 116×105 px: sul 10 pollici la digitazione diventa quasi comoda. Serve comunque solo per la password del Wi-Fi e per l'indirizzo di Home Assistant.",
 pin:"<b>PIN rete privata.</b> Tastierino con tasti da 72 px e tentativi residui dichiarati. Dietro il velo si intravede la schermata oscurata.",
 priv:"<b>Rete privata sbloccata.</b> Password nascosta anche dopo il PIN, conto alla rovescia in testata e avviso ambra su cosa raggiunge chi si collega.",
 pag:"<b>Seconda pagina delle luci.</b> Le tre zone restanti mantengono la dimensione delle altre: i posti vuoti restano vuoti, tratteggiati, invece di far crescere le schede. Così la posizione di ogni zona non cambia mai fra una pagina e l'altra."
};

let scr='inv';
function render(){
  document.getElementById('stage').innerHTML=S[scr];
  document.getElementById('cap').innerHTML=CAP[scr];
  document.querySelectorAll('#g1 button,#g2 button,#g3 button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.s===scr)));
}
document.querySelectorAll('#g1 button,#g2 button,#g3 button').forEach(b=>b.onclick=()=>{scr=b.dataset.s;render()});
render();
const frame=document.getElementById('frame'),stage=document.getElementById('stage');
function fit(){const s=Math.min(1,(frame.parentElement.clientWidth-24)/1280);
  stage.style.transform='scale('+s+')';frame.style.width=(1280*s+24)+'px';frame.style.height=(800*s+24)+'px';}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
