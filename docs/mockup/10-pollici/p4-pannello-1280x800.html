<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foyer Panel · pannello 10.1" · ESP32-P4 · 1280×800</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#15171b;color:#d8dce3;font-family:Inter,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.shell{max-width:1400px;margin:0 auto;padding:18px 14px 60px}
h1.tt{font-size:15px;font-weight:600;margin:0 0 2px;color:#e6e9ee}
p.sub{font-size:12.5px;color:#8b929e;margin:0 0 14px}
.grp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.grp button{appearance:none;border:1px solid #2c3038;background:#1c1f25;color:#aeb5c0;font:500 12.5px/1 Inter,sans-serif;padding:9px 12px;border-radius:8px;cursor:pointer}
.grp button:hover{border-color:#3d434e;color:#e6e9ee}
.grp button[aria-pressed="true"]{background:#e6e9ee;color:#15171b;border-color:#e6e9ee}
.frame{position:relative;background:#000;border:12px solid #24272d;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.5);overflow:hidden;margin:0 auto}
.stage{width:1280px;height:800px;transform-origin:top left;position:relative;overflow:hidden}
.caption{font-size:12.5px;color:#9aa1ad;margin:12px 2px 0;line-height:1.6;max-width:980px}
.caption b{color:#e6e9ee;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.screen{position:absolute;inset:0;width:1280px;height:800px;display:flex;overflow:hidden;
  --bg:#0d1014;--card:#151a21;--card2:#11161c;--line:#1e242d;--txt:#e8ecf2;--dim:#8a95a6;
  --acc:#f0a835;--ok:#4fc39a;--warn:#e2664f;--r:16px;--ink:#0d1014;--off:#232b35;
  background:var(--bg);color:var(--txt)}
.col{flex-direction:column}

/* ---------- rail 106 ---------- */
.mrail{width:106px;flex:none;background:var(--card2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:9px}
.mhome{width:88px;height:66px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--acc);margin-bottom:8px;flex:none}
.mhome svg{width:25px;height:25px}
.mhome span{font:600 11px/1 Inter,sans-serif;letter-spacing:.1em}
.mitem{width:88px;flex:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#6f7b8c;margin-bottom:4px}
.mitem svg{width:24px;height:24px}
.mitem span{font:500 11px/1 Inter,sans-serif}
.mitem.sel{background:#221c0e;color:var(--acc);box-shadow:inset 0 0 0 1px #4a3c1c}
.mgear{width:88px;height:56px;flex:none;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#6f7b8c;margin-top:4px}
.mgear svg{width:22px;height:22px}
.mgear span{font:500 11px/1 Inter,sans-serif}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.mhead{height:66px;flex:none;display:flex;align-items:center;padding:0 22px;gap:16px}
.mhead .ti{font:600 26px/1 Inter,sans-serif;letter-spacing:-.01em}
.mhead .cr{font:400 14px/1 Inter,sans-serif;color:var(--dim)}
.mhead .clock{margin-left:auto;font:400 24px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--dim)}
.pager{display:flex;align-items:center;gap:9px;margin-left:auto}
.pager .ar{width:48px;height:44px;border:1px solid var(--line);background:var(--card2);border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.pager .ar svg{width:20px;height:20px}
.pager .ar.off{opacity:.3}
.pager .n{font:500 14px/1 Inter,sans-serif;color:var(--dim);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.dots{height:28px;flex:none;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--off)}
.dots i.on{background:var(--acc);width:24px;border-radius:5px}
.content{flex:1;min-height:0;padding:4px 20px 18px;display:flex;flex-direction:column}
.k{font:600 12px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}

/* ---------- HOME ---------- */
.hh{height:102px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line)}
.hh .t{font:600 56px/1 Inter,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hh .d{font:400 15px/1.3 Inter,sans-serif;color:var(--dim)}
.hh .left{display:flex;align-items:baseline;gap:16px}
.hh .wx{display:flex;align-items:center;gap:18px}
.hh .wx .now{display:flex;align-items:center;gap:12px}
.hh .wx svg{width:31px;height:31px;color:var(--acc)}
.hh .wx .deg{font:500 36px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.hh .wx .meta{font:400 13px/1.45 Inter,sans-serif;color:var(--dim)}
.hh .hours{display:flex;gap:16px;padding-left:18px;border-left:1px solid var(--line)}
.hh .hr{text-align:center}
.hh .hr .h{font:500 12px/1 Inter,sans-serif;color:var(--dim)}
.hh .hr svg{width:19px;height:19px;color:#c3cad6;margin:7px 0}
.hh .hr .v{font:500 14px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}

.home{flex:1;min-height:0;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.band{height:300px;flex:none;display:flex;gap:14px}
.cardp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.c-pres{width:250px;flex:none}
.plist{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px}
.prow{display:flex;align-items:center;gap:13px;padding:8px 0}
.av{width:42px;height:42px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 17px/1 Inter,sans-serif;background:#232b35;color:#8f9aa9}
.av.in{background:var(--acc);color:var(--ink)}
.prow .nm{font:500 17px/1 Inter,sans-serif}
.prow .st{font:400 13px/1.3 Inter,sans-serif;color:var(--dim);margin-top:5px}
.prow.out .nm{color:var(--dim)}

.c-en{width:296px;flex:none}
.en-main{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.en-main .v{font:600 52px/1 Inter,sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ok)}
.en-main .u{font:500 15px/1.2 Inter,sans-serif;color:var(--dim)}
.en-rows{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.en-row{display:flex;align-items:center;gap:11px}
.en-row svg{width:19px;height:19px;color:var(--dim);flex:none}
.en-row .nm{font:400 14px/1 Inter,sans-serif;color:var(--dim)}
.en-row .val{font:500 17px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;margin-left:auto}
.en-batt{margin-top:auto;padding-top:13px;border-top:1px solid var(--line)}
.en-batt .r{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.en-batt .r svg{width:19px;height:19px;color:var(--dim)}
.en-batt .r .nm{font:400 14px/1 Inter,sans-serif;color:var(--dim)}
.en-batt .r b{margin-left:auto;font:500 17px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.en-batt .sub{font:400 13px/1 Inter,sans-serif;color:var(--dim);margin-top:9px}
.bar{height:10px;border-radius:6px;background:var(--off);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ok)}

.c-open{width:320px;flex:none}
.op-big{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.op-big .v{font:600 50px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--acc)}
.op-big .u{font:500 15px/1.3 Inter,sans-serif;color:var(--dim)}
.op-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.op-list .l{font:400 14px/1.3 Inter,sans-serif;color:#b6bfcd}
.op-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--line)}
.op-foot .f{display:flex;align-items:center;gap:10px;font:400 13.5px/1 Inter,sans-serif;color:var(--dim)}
.op-foot .f svg{width:16px;height:16px;color:#5d6878}
.op-foot .f b{color:var(--txt);font-weight:500}

.c-ag{flex:1;min-width:0}
.ag-list{flex:1;display:flex;flex-direction:column;gap:11px;margin-top:12px;overflow:hidden}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev .tm{font:600 14px/1.25 Inter,sans-serif;color:var(--acc);width:48px;flex:none;font-variant-numeric:tabular-nums}
.ev .tx{font:400 15px/1.3 Inter,sans-serif}
.ev .who{font:400 12.5px/1.3 Inter,sans-serif;color:var(--dim);margin-top:4px}
.ev.past .tm{color:#5d6878}.ev.past .tx{color:#6f7b8c}
.ag-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font:400 13.5px/1.3 Inter,sans-serif;color:var(--dim)}

.strip{height:130px;flex:none;display:flex;gap:12px}
.sth{flex:1;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a0e14}
.sth svg.scene{position:absolute;inset:0;width:100%;height:100%}
.sth .nm{position:absolute;left:11px;bottom:9px;font:500 13px/1 Inter,sans-serif;color:#fff;text-shadow:0 1px 4px #000}
.sth .age{position:absolute;right:9px;top:8px;font:500 11px/1 Inter,sans-serif;color:#cfd6e0;background:rgba(0,0,0,.6);padding:4px 7px;border-radius:5px}
.sth .lv{position:absolute;left:11px;top:9px;display:flex;align-items:center;gap:6px;font:600 11px/1 Inter,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:5px}
.sth .lv i{width:6px;height:6px;border-radius:50%;background:#e2664f;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}

.dock{flex:1;min-height:0;display:flex;gap:10px}
.db{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 6px;overflow:hidden}
.db svg{width:25px;height:25px;color:#8b95a5;flex:none}
.db .nm{font:600 11.5px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.db .st{font:400 12px/1 Inter,sans-serif;color:var(--dim);white-space:nowrap}
.db.acc{border-color:#3a2f1a}.db.acc svg{color:var(--acc)}.db.acc .st{color:var(--acc)}

/* ---------- LUCI / CLIMA 4x2 ---------- */
.g4{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:14px;min-height:0}
.lc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;justify-content:space-between}
.lc .top{display:flex;align-items:center;gap:11px}
.lc .top svg{width:22px;height:22px;color:var(--dim)}
.lc .nm{font:500 17px/1 Inter,sans-serif}
.lc .sw{margin-left:auto;width:58px;height:32px;border-radius:20px;background:var(--off);position:relative}
.lc .sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#6b7686}
.lc.on .sw{background:var(--acc)}
.lc.on .sw i{left:29px;background:var(--ink)}
.lc .pct{font:600 34px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.lc .pct span{font-size:17px;color:var(--dim)}
.lc .track{height:9px;border-radius:6px;background:var(--off);position:relative;overflow:hidden}
.lc .track i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:6px}
.lc.off .pct,.lc.off .nm{color:var(--dim)}

.cl-top{height:58px;flex:none;display:flex;gap:12px;margin-bottom:14px}
.cl-chip{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:13px;display:flex;align-items:center;justify-content:center;font:500 16px/1 Inter,sans-serif;color:var(--dim)}
.cl-chip.sel{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600}
.cl-ext{width:220px;flex:none;border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;justify-content:center;gap:11px;font:500 16px/1 Inter,sans-serif;color:#c3cad6}
.cl-ext svg{width:21px;height:21px;color:var(--acc)}
.zone{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.zone .zt{display:flex;align-items:center;gap:10px}
.zone .zt .nm{font:500 17px/1 Inter,sans-serif}
.zone .zt .hum{margin-left:auto;font:400 13px/1 Inter,sans-serif;color:var(--dim)}
.zone .now{font:600 40px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.zone .set{display:flex;align-items:center;gap:11px}
.zone .set .b{width:48px;height:42px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font:500 22px/1 Inter,sans-serif;color:var(--dim);background:var(--card2)}
.zone .set .v{flex:1;text-align:center;font:500 18px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.zone .set .v small{display:block;font:400 12px/1 Inter,sans-serif;color:var(--dim);margin-top:6px}
.zone.heat{border-color:#3a2f1a}.zone.heat .now{color:var(--acc)}
.zone.off .now,.zone.off .nm{color:var(--dim)}

/* ---------- ENERGIA ---------- */
.stats{height:118px;flex:none;display:flex;gap:14px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 17px;display:flex;flex-direction:column;justify-content:space-between}
.stat .v{font:600 38px/1 Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .v small{font-size:17px;color:var(--dim);margin-left:4px;font-weight:500}
.stat .s{font:400 13px/1.3 Inter,sans-serif;color:var(--dim)}
.pvmain{flex:1;display:flex;gap:14px;min-height:0}
.chart{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 18px 12px;display:flex;flex-direction:column;min-width:0}
.chart .hd{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.chart .hd .t{font:500 16px/1 Inter,sans-serif}
.chart .hd .m{font:400 13px/1 Inter,sans-serif;color:var(--dim);margin-left:auto}
.chart svg{flex:1;width:100%;min-height:0}
.strings{width:340px;flex:none;display:flex;flex-direction:column;gap:14px}
.str{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 17px;display:flex;flex-direction:column;justify-content:space-between}
.str .nm{font:500 16px/1 Inter,sans-serif}
.str .big{font:600 30px/1 Inter,sans-serif;font-variant-numeric:tabular-nums}
.str .det{display:flex;gap:18px;font:400 13px/1.3 Inter,sans-serif;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:7px}

/* ---------- TELECAMERE ---------- */
.qgrid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:14px;min-height:0}
.qcam{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#05070a}
.qcam svg.scene{position:absolute;inset:0;width:100%;height:100%}
.qcam .nm{position:absolute;left:14px;bottom:12px;font:500 16px/1 Inter,sans-serif;color:#fff;text-shadow:0 1px 4px #000}
.qcam .lv{position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:7px;font:600 12px/1 Inter,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px}
.qcam .lv i{width:7px;height:7px;border-radius:50%;background:#e2664f;animation:bl 1.6s infinite}
.qcam .fps{position:absolute;right:12px;top:12px;font:500 12px/1 Inter,sans-serif;color:#cfd6e0;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:6px}
.qbar{height:68px;flex:none;margin-top:14px;display:flex;align-items:center;gap:26px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
.qbar .it{display:flex;align-items:center;gap:10px;font:400 13.5px/1 Inter,sans-serif;color:var(--dim);font-variant-numeric:tabular-nums}
.qbar .it svg{width:17px;height:17px;color:#5d6878}
.qbar .it b{color:var(--txt);font-weight:500}

/* ---------- ACCESSI ---------- */
.acc{flex:1;display:flex;gap:16px;min-height:0}
.cam{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.camview{flex:1;position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#05070a;min-height:0}
.camview svg.scene{position:absolute;inset:0;width:100%;height:100%}
.camview .ov{position:absolute;left:14px;top:13px;display:flex;align-items:center;gap:10px;font:600 13px/1 Inter,sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.camview .live{display:inline-flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:7px}
.camview .live i{width:8px;height:8px;border-radius:50%;background:#e2664f;animation:bl 1.6s infinite}
.camview .rate{position:absolute;left:14px;bottom:12px;font:500 12.5px/1 Inter,sans-serif;color:#cfd6e0;background:rgba(0,0,0,.55);padding:7px 10px;border-radius:7px}
.camview .ts{position:absolute;right:14px;bottom:12px;font:500 13px/1 Inter,sans-serif;color:#e6eaf0;background:rgba(0,0,0,.55);padding:7px 10px;border-radius:7px;font-variant-numeric:tabular-nums}
.thumbs{height:96px;flex:none;display:flex;gap:12px}
.th{flex:1;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:#0a0e14}
.th.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.th svg.scene{position:absolute;inset:0;width:100%;height:100%}
.th span.n{position:absolute;left:10px;bottom:8px;font:500 13px/1 Inter,sans-serif;color:#dfe5ee;text-shadow:0 1px 3px #000}
.ctrls{width:400px;flex:none;display:flex;flex-direction:column;gap:12px}
.arow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);flex:1;display:flex;align-items:center;gap:15px;padding:0 16px}
.arow>svg{width:24px;height:24px;color:var(--dim);flex:none}
.arow .nm{font:500 17px/1.15 Inter,sans-serif}
.arow .st{font:400 13px/1.3 Inter,sans-serif;color:var(--dim);margin-top:5px}
.btn{margin-left:auto;flex:none;background:var(--acc);color:var(--ink);border-radius:11px;padding:15px 20px;font:600 16px/1 Inter,sans-serif;text-align:center;min-width:120px}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn small{display:block;font:500 11px/1 Inter,sans-serif;color:rgba(0,0,0,.55);margin-top:6px;letter-spacing:.06em}
.btn.ghost small{color:var(--dim)}
.log{height:72px;flex:none;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:11px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.log .ln{font:400 13.5px/1.2 Inter,sans-serif;color:var(--dim);font-variant-numeric:tabular-nums}
.log .ln b{color:var(--txt);font-weight:500}

/* ---------- AGENDA 4 colonne ---------- */
.agcols{flex:1;display:flex;gap:14px;min-height:0}
.agcol{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:flex;flex-direction:column;min-width:0}
.agcol .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.agcol .hd .t{font:600 17px/1 Inter,sans-serif}
.agcol .hd .d{font:400 13px/1 Inter,sans-serif;color:var(--dim);margin-left:auto}
.agev{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.agev:first-of-type{border-top:none}
.agev .bl{width:3px;border-radius:3px;background:var(--acc);flex:none}
.agev .bl.b2{background:#4fc39a}.agev .bl.b3{background:#6f9fe0}
.agev .tm{font:600 13.5px/1.2 Inter,sans-serif;color:var(--dim);width:48px;flex:none;font-variant-numeric:tabular-nums;padding-top:2px}

function qr(seed){
  let s=seed,N=25,m=[];
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
  for(let y=0;y<N;y++){m[y]=[];for(let x=0;x<N;x++)m[y][x]=rnd()>0.52?1:0}
  const fp=(ox,oy)=>{for(let y=0;y<7;y++)for(let x=0;x<7;x++){
    const b=(x===0||x===6||y===0||y===6)||(x>1&&x<5&&y>1&&y<5);m[oy+y][ox+x]=b?1:0}
    for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const px=ox+x,py=oy+y;
      if(px>=0&&py>=0&&px<N&&py<N&&(x<0||x>6||y<0||y>6))m[py][px]=0}};
  fp(0,0);fp(N-7,0);fp(0,N-7);
  for(let i=8;i<N-8;i++){m[6][i]=i%2?0:1;m[i][6]=i%2?0:1}
  let r=`<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges" style="width:100%;height:100%"><rect width="${N}" height="${N}" fill="#fff"/><g fill="#0d1014">`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  return r+'</g></svg>';
}
